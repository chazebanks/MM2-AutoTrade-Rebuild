name: Gingerscope C8 restart original C3-to-C4 census race (read-only)
on:
  pull_request:
    paths:
      - 'pdiddler/system2/native_bilateral_attractiveness_bridge.lua'
      - 'pdiddler/ci/system2_native_market_inventory_offer_bridge_mocks.luau'
      - 'pdiddler/system2/native_partner_intent_observer.lua'
      - 'pdiddler/system2/native_v2_client_response_envelope.lua'
      - 'pdiddler/system2/native_market_inventory_offer_core.lua'
      - 'pdiddler/ci/test_system2_c8_original_source_v2.py'
      - '.github/workflows/gingerscope-c8-restart-original-census-race.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  c8-original-census-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install source reader and verified native Luau executor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5'
          archive="$RUNNER_TEMP/lune-v0.11.1.zip"
          curl -fsSL --retry 3 --connect-timeout 20 'https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip' -o "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/lune-dist"
          lune_bin="$(find "$RUNNER_TEMP/lune-dist" -type f -name lune -print -quit)"
          test -n "$lune_bin"
          install -m 0755 "$lune_bin" "$RUNNER_TEMP/lune"
      - name: Acquire original immutable Stage83 historical game-key registry
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 --retry 2 'https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild/25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae/pdiddler/intelligence_lab/stage83_public_slug_registry.lua' -o "$RUNNER_TEMP/stage83.lua"
          test "$(git hash-object "$RUNNER_TEMP/stage83.lua")" = "40e2a0ff01b70b2d0181c62cae347a08da82bcb8"
      - name: Exercise original Python source and identity regressions
        env:
          GINGERSCOPE_PINNED_STAGE83: ${{ runner.temp }}/stage83.lua
        run: |
          python3 -m unittest -q \
            pdiddler.ci.test_system2_mm2tradehub_market_candidate \
            pdiddler.ci.test_system2_public_market_gamekey_crosswalk \
            pdiddler.ci.test_system2_real_intelligence_decisions
      - name: Verify immutable historical game-key replay fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object pdiddler/system2/research_market_crosswalk_current.json)" = 'e92cb3796bcb11c7df6c090e364a68f8e22270eb'
          python3 - <<'PY'
          from pathlib import Path
          import datetime,json
          x=json.loads(Path('pdiddler/system2/research_market_crosswalk_current.json').read_text())
          assert x['matchedHistoricalGameKeys']==189==len(x['items'])
          assert len({row['rawGameKeyCandidate'] for row in x['items']})==189
          assert x['historicalRegistryBlob']=='40e2a0ff01b70b2d0181c62cae347a08da82bcb8'
          assert x['sourceRetrievedUtc']=='2026-11-14T21:43:14Z'
          assert x['researchOnly'] is True
          for flag in ('authorizesAccept','authorizesTrade','mayUseForLiveOffer','mayReportProfit','mayUseForLearning'):
              assert x[flag] is False
          stamp=datetime.datetime.fromisoformat(x['sourceRetrievedUtc'].replace('Z','+00:00'))
          Path('pdiddler/system2/research_market_epoch.txt').write_text(str(int(stamp.timestamp())))
          print('C8_ARCHIVED_GAME_KEY_REPLAY_ONLY', x['sourceRetrievedUtc'], x['matchedHistoricalGameKeys'])
          PY
      - name: Exercise actual C3 original GUI scanner through C4 scorer
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_native_market_inventory_offer_bridge_mocks.luau
      - name: Read genuine C3 P4 C6 C7 offline envelope through strict Python V2 receiver
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest pdiddler.ci.test_system2_c8_original_source_v2 -v
      - name: Native bridge forbidden actions audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for f in ('native_bilateral_attractiveness_bridge.lua','native_market_inventory_offer_core.lua'):
              s=Path('pdiddler/system2',f).read_text()
              for bad in ('FireServer(', 'InvokeServer(', 'AcceptTrade(', 'PostAsync(', 'SendAsync(', 'TeleportService'):
                  assert bad not in s,(f,bad)
          PY
