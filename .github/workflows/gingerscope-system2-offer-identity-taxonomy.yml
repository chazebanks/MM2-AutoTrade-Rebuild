name: Gingerscope System2 offered item identity varied error cases (offline)
on:
  push:
    branches:
      - research/system2-sixth-offer-offline-taxonomy-nov14
  pull_request:
    paths:
      - 'pdiddler/system2/native_offer_item_identity_resolver.lua'
      - 'pdiddler/ci/system2_offer_identity_error_taxonomy_mocks.luau'
      - 'pdiddler/system2/S2_SIXTH_OFFER_AND_MULTIFUNCTION_HANDOFF_2026_11_14.md'
      - '.github/workflows/gingerscope-system2-offer-identity-taxonomy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-stage9-slot-identity-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Byte-pin actual System2 offer resolver and original Stage9 quantity parser
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pdiddler.continuity.manager verify
          python3 -m pdiddler.continuity.manager recover
          git fetch --no-tags --depth=1 origin e9b5473ffc3adf14c3ba2d660a6a9b9929e7522b
          git show e9b5473ffc3adf14c3ba2d660a6a9b9929e7522b:pdiddler/system2/native_offer_item_identity_resolver.lua > "$RUNNER_TEMP/s2-identity.lua"
          test "$(git hash-object "$RUNNER_TEMP/s2-identity.lua")" = b05f70710606ea087079ffa079a76d88568dadf5
          cmp "$RUNNER_TEMP/s2-identity.lua" pdiddler/system2/native_offer_item_identity_resolver.lua
          git fetch --no-tags --depth=1 origin 1971b93d324f0275e6a9affb472ac3e804439ed8
          mkdir -p pdiddler/new_part4
          git show 1971b93d324f0275e6a9affb472ac3e804439ed8:pdiddler/new_part4/p4_observer_contract.lua > pdiddler/new_part4/p4_observer_contract.lua
          test "$(git hash-object pdiddler/new_part4/p4_observer_contract.lua)" = 7c84456006bd684dacb0217d0ae092d6d67575a4
          echo ORIGINAL_STAGE9_QUANTITY_AND_S2_ITEM_RESOLVER_PINNED
      - name: Install SHA256-pinned official Lune v0.11.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lune-v0.11.1-linux-x86_64.zip"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip" \
            --output "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/lune-dist"
          found="$(find "$RUNNER_TEMP/lune-dist" -type f -name lune -print -quit)"
          test -n "$found"
          install -m 0755 "$found" "$RUNNER_TEMP/lune"
      - name: Execute distinct raw id, quantity, Chroma, rarity, alias and collision cases
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_offer_identity_error_taxonomy_mocks.luau
      - name: Prove this resolver cannot touch or Accept a Roblox trade
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pdiddler/system2/native_offer_item_identity_resolver.lua').read_text()
          for term in ("FireServer(", "InvokeServer(", "AcceptTrade(", "OfferItem(", "game:GetService(", "setclipboard(", "HttpGet(", "TeleportService"):
              assert term not in s, term
          assert 'RESOLVED_CLIENT_CATALOG_ONLY' in s
          assert 'NAME_ONLY_CATALOG_VARIANT_OR_ALIAS_AMBIGUOUS' in s
          assert 'SLOT_QUANTITY_INVALID_OR_UNPROVEN' in s
          print('S2_OFFER_IDENTITY_NO_ACCEPT_OR_ACTION_PASS')
          PY
