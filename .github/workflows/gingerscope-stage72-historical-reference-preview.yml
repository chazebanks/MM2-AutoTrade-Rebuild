name: Stage72 historical MM2 Supreme reference preview, trading paused
on:
  push:
    branches:
      - research/gingerscope-stage72-unverified-historical-reference-view
    paths:
      - '.github/workflows/gingerscope-stage72-historical-reference-preview.yml'
      - 'pdiddler/intelligence_lab/stage72_historical_reference_preview.lua'
      - 'pdiddler/tests/test_stage72_historical_reference_preview.py'
      - 'pdiddler/intelligence_lab/STAGE72_HISTORICAL_REFERENCE_PREVIEW_HANDOFF.md'
  pull_request:
    paths:
      - '.github/workflows/gingerscope-stage72-historical-reference-preview.yml'
      - 'pdiddler/intelligence_lab/stage72_historical_reference_preview.lua'
      - 'pdiddler/tests/test_stage72_historical_reference_preview.py'
      - 'pdiddler/intelligence_lab/STAGE72_HISTORICAL_REFERENCE_PREVIEW_HANDOFF.md'
permissions:
  contents: read
jobs:
  history-not-market-price:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual Lua5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Execute actual read-only Lua preview, source variants and 300 corruptions
        run: |
          set -euo pipefail
          python3 -m unittest -v pdiddler.tests.test_stage72_historical_reference_preview
      - name: Ensure independent source/identity/clock regressions remain protected
        run: |
          set -euo pipefail
          python3 -m unittest -q \
            pdiddler.tests.test_stage70_raw_checker_proof_gate \
            pdiddler.tests.test_stage69_source_boundaries \
            pdiddler.tests.test_stage69_manifest_provenance
