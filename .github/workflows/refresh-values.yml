name: Audit MM2Values source (NO automatic market publication)
on:
  workflow_dispatch:
  schedule:
    - cron: "15 18 * * *"
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install audit-only source parsers
        run: python -m pip install "requests>=2.32,<3" "beautifulsoup4>=4.12,<5"
      - name: Fetch all three source pages, calculate diff, and quarantine candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_values.py --audit-only \
            --output-dir "$RUNNER_TEMP/mm2_market_refresh"
      - name: Upload candidate/source-diff for manual review (never publish values)
        uses: actions/upload-artifact@v4
        with:
          name: mm2values-unreviewed-source-audit
          path: ${{ runner.temp }}/mm2_market_refresh/*
          if-no-files-found: error
          retention-days: 14
