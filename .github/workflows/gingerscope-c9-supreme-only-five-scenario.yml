name: Gingerscope C9 five-scenario manual-only Supreme protected iPad research
on:
  pull_request:
    paths:
      - 'pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_START.lua'
      - 'pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_NATIVE.lua'
      - 'pdiddler/system2/native_supreme_only_current_offer_button.lua'
      - 'pdiddler/system2/native_supreme_only_five_scenario_recorder.lua'
      - 'pdiddler/ci/system2_supreme_only_five_scenario_recorder_mocks.luau'
      - 'pdiddler/ci/test_supreme_five_scenario_manual_policy.py'
      - 'pdiddler/system2/native_sha256_rfc6234_readonly.lua'
      - 'pdiddler/system2/native_supreme_only_bilateral_research_nov17.lua'
      - 'pdiddler/system2/native_supreme_only_protected_c3p4_adapter_nov17.lua'
      - 'pdiddler/system2/supreme_only_189_research_catalog_2026_11_17_refresh.json'
      - 'pdiddler/ci/system2_supreme_only_protected_c3p4_nov17_mocks.luau'
      - 'pdiddler/ci/stage119_c9_supreme_only_five_scenario_loader_mocks.luau'
      - 'pdiddler/ci/stage119_c9_supreme_only_five_scenario_original_host_mocks.luau'
      - 'pdiddler/ci/test_supreme_only_intratrade_button_nov17.py'
      - 'pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_CLEAN_START.lua'
      - 'pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_CLEAN_NATIVE.lua'
      - 'pdiddler/system2/native_supreme_five_scenario_gui_presentation.lua'
      - 'pdiddler/ci/system2_supreme_five_stage_gui_presentation_mocks.luau'
      - 'pdiddler/ci/stage119_c9_supreme_five_stage_clean_loader_mocks.luau'
      - 'pdiddler/ci/stage119_c9_supreme_five_stage_clean_original_host_mocks.luau'
      - 'pdiddler/ci/test_supreme_five_stage_gui_cleanup_integrity.py'
      - '.github/workflows/gingerscope-c9-supreme-only-five-scenario.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-manual-arm-five-scenario-supreme-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source bytes, SHA, publisher edition and pinned native bootstrap
        run: python3 -m unittest -v pdiddler.ci.test_supreme_five_scenario_manual_policy
      - name: Exact-byte protected host GUI refactor equivalence and source pins
        run: python3 -m unittest -v pdiddler.ci.test_supreme_five_stage_gui_cleanup_integrity
      - name: Install pinned audited Luau Lune interpreter
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lune-v0.11.1.zip"
          curl -fLsS --retry 3 --connect-timeout 20 \
            "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip" \
            -o "$archive"
          printf '%s  %s\n' '39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1' "$archive" | sha256sum -c -
          unzip -q "$archive" -d "$RUNNER_TEMP/lune-dist"
          binary="$(find "$RUNNER_TEMP/lune-dist" -type f -name lune -print -quit)"
          test -n "$binary"
          install -m 0755 "$binary" "$RUNNER_TEMP/lune"
      - name: Pure five-stage GUI and original protected panel renderer native tests
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_supreme_five_stage_gui_presentation_mocks.luau
      - name: New immutable cleaned original Stage119 manual-only loader native tests
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/stage119_c9_supreme_five_stage_clean_loader_mocks.luau
      - name: Check actual standalone portable SHA-256 + refreshed 189 Supreme-only protected bridge
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_supreme_only_protected_c3p4_nov17_mocks.luau
      - name: Verify genuine Luau single-tap current-offer module and adversarial GUI change guards
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_supreme_only_current_offer_button_mocks.luau
      - name: Run full five-stage pure manual scenario state-machine adversarial Luau tests
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_supreme_only_five_scenario_recorder_mocks.luau
      - name: Check single-execute native startup/manual ARM guard through original loader mocks
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/stage119_c9_supreme_only_five_scenario_loader_mocks.luau
      - name: Prepare original immutable Stage9/83/101, boot and coordinator host dependencies
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild"
          mkdir -p /tmp/gingerscope-stage220
          curl -fLsS --retry 2 --max-time 50 "$base/1971b93d324f0275e6a9affb472ac3e804439ed8/pdiddler/new_part4/p4_observer_contract.lua" -o /tmp/gingerscope-stage220/stage9.lua
          curl -fLsS --retry 2 --max-time 50 "$base/1971b93d324f0275e6a9affb472ac3e804439ed8/pdiddler/new_part4/p4_native_observer.lua" -o /tmp/gingerscope-stage220/native_stage9.lua
          curl -fLsS --retry 2 --max-time 50 "$base/25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae/pdiddler/intelligence_lab/stage83_public_slug_registry.lua" -o /tmp/gingerscope-stage220/stage83.lua
          curl -fLsS --retry 2 --max-time 50 "$base/15f762a27a968373ed82809345f1869e1f688b26/pdiddler/intelligence_lab/stage101_multiweapon_raw_key_match.lua" -o /tmp/gingerscope-stage220/stage101.lua
          curl -fLsS --retry 2 --max-time 50 "$base/af84b23173620b03e919187b08cd352c101ba4ea/pdiddler/supervised/supervised_p3_startup_supervisor.lua" -o /tmp/gingerscope-stage220/frozen_boot.lua
          curl -fLsS --retry 2 --max-time 50 "$base/9138751b5a57415939ffa1618ac57811d7c8ec7b/pdiddler/supervised/supervised_real_p3_rotation_handoff.lua" -o /tmp/gingerscope-stage220/frozen_coordinator.lua
          test "$(git hash-object /tmp/gingerscope-stage220/stage9.lua)" = '7c84456006bd684dacb0217d0ae092d6d67575a4'
          test "$(git hash-object /tmp/gingerscope-stage220/native_stage9.lua)" = 'a6338e946467ad738005bc5cb13cd2d2fbc2a2d0'
          test "$(git hash-object /tmp/gingerscope-stage220/stage83.lua)" = '40e2a0ff01b70b2d0181c62cae347a08da82bcb8'
          test "$(git hash-object /tmp/gingerscope-stage220/stage101.lua)" = '137585d778c3c08b8b6960013fa34a7b3fb7b463'
          test "$(git hash-object /tmp/gingerscope-stage220/frozen_boot.lua)" = '881713c2abe644c0823f46c4007a80815608ea05'
          test "$(git hash-object /tmp/gingerscope-stage220/frozen_coordinator.lua)" = '1d4decbc30378a3f83df7c6b83449c6ac5252899'
      - name: Check complete original protected P3/P4 lexical native host and new Supreme bridge
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/stage119_c9_supreme_only_five_scenario_original_host_mocks.luau
      - name: Run true original Stage119 protected P3/P4 with cleaned GUI in all five stages
        shell: bash
        run: |
          "$RUNNER_TEMP/lune" run pdiddler/ci/stage119_c9_supreme_five_stage_clean_original_host_mocks.luau
      - name: Check no hidden automated offer or trade permission in public launcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          start=Path("pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_CLEAN_START.lua").read_text()
          host=Path("pdiddler/supervised/STAGE119_C9_SUPREME_ONLY_FIVE_SCENARIO_CLEAN_NATIVE.lua").read_text()
          for txt in (start,host):
              for call in ("remote:FireServer(","remote:InvokeServer(",
                           "AcceptTrade:FireServer","OfferItem:FireServer",
                           "TeleportService:Teleport","sendChat("):
                  assert call not in txt,call
          assert "cfg.c9SupremeOnlyReadOnly~=true" in host
          assert "c9SupremeOnlyReadOnlyPreview=c9SupremeOnlyReadOnlyPreview" in host
          assert "native_sha256_rfc6234_readonly.lua" in host
          assert 'setDisplayIfChanged(ui.preview,"Visible",content.previewVisible)' in host
          gui=Path("pdiddler/system2/native_supreme_five_scenario_gui_presentation.lua").read_text()
          assert 'ui.preview=action("SupremePreview","SUPREME PREVIEW",12)' in gui
          assert "pcall(presenter.buildUI,{" in host
          assert "cfg.c9FiveScenarioManualTest~=true" in host
          assert "cfg.noAutomaticWeaponOffers~=true" in host
          assert "cfg.neverFinalAcceptDuringTest~=true" in host
          assert "noWeaponAddOrRemoveTests==true" in start
          assert "noWeaponAddOrRemoveTests~=true" not in start
          assert "fiveScenarioResults=fiveScenarioSummary.results" in host
          print("C9_SUPREME_FIVE_SCENARIO_MANUAL_ONLY_NO_AUTOMATION=PASS")
          PY
