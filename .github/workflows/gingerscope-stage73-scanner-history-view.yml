name: Stage73 scanner-only reference view integration, no trading
on:
  push:
    branches:
      - research/gingerscope-stage72-unverified-historical-reference-view
    paths:
      - '.github/workflows/gingerscope-stage73-scanner-history-view.yml'
      - 'pdiddler/new_part4/STAGE73_SCANNER_HISTORY_ONLY_BOOT.lua'
      - 'pdiddler/presentation/pdiddler3_scanner_view_stage73_history_v1.lua'
      - 'pdiddler/tests/test_stage73_scanner_history_view.py'
      - 'pdiddler/intelligence_lab/STAGE73_SCANNER_HISTORY_ONLY_HANDOFF.md'
  pull_request:
    paths:
      - '.github/workflows/gingerscope-stage73-scanner-history-view.yml'
      - 'pdiddler/new_part4/STAGE73_SCANNER_HISTORY_ONLY_BOOT.lua'
      - 'pdiddler/presentation/pdiddler3_scanner_view_stage73_history_v1.lua'
      - 'pdiddler/tests/test_stage73_scanner_history_view.py'
      - 'pdiddler/intelligence_lab/STAGE73_SCANNER_HISTORY_ONLY_HANDOFF.md'
permissions:
  contents: read
jobs:
  legacy-scanner-read-only-presenter:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install actual Lua5.4
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Execute actual T4.4 presentation and scanner-only boot source tests
        run: |
          set -euo pipefail
          python3 -m unittest -v pdiddler.tests.test_stage73_scanner_history_view
      - name: Inherited historical-value and trust-boundary regressions
        run: |
          set -euo pipefail
          python3 -m unittest -q \
            pdiddler.tests.test_stage72_historical_reference_preview \
            pdiddler.tests.test_stage70_raw_checker_proof_gate \
            pdiddler.tests.test_stage69_source_boundaries \
            pdiddler.tests.test_stage69_manifest_provenance
