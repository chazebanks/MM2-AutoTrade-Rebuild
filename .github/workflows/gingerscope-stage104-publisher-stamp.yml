name: Gingerscope Stage104 original-source publisher stamp and canonical URL gate
on:
  push:
    branches:
      - research/gingerscope-stage104-publisher-stamp-audit
    paths:
      - 'pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py'
      - 'pdiddler/tests/test_stage104_publication_timestamp_gate.py'
      - 'pdiddler/intelligence_lab/STAGE104_SOURCE_FRESHNESS_HANDOFF.md'
      - '.github/workflows/gingerscope-stage104-publisher-stamp.yml'
  pull_request:
    paths:
      - 'pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py'
      - 'pdiddler/tests/test_stage104_publication_timestamp_gate.py'
      - 'pdiddler/intelligence_lab/STAGE104_SOURCE_FRESHNESS_HANDOFF.md'
      - '.github/workflows/gingerscope-stage104-publisher-stamp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-first-party-publication-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve EXACT original Stage84 three source pages and verified Stage69 parser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gingerscope104/original
          base='https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild'
          curl -fsSL --retry 3 --max-time 45 "$base/af4fee60ab9db45f9f018bc0fc691f025e2fbd5f/pdiddler/refresh_supreme_snapshot.py" -o /tmp/gingerscope104/parser.py
          for tier in ancients godlies chromas; do
            curl -fsSL --retry 3 --max-time 45 "$base/f08ceb35a9ff684ee2cf577ccce7542c436cc68e/pdiddler/research_source_html/stage84_2026_11_09/$tier.html" -o "/tmp/gingerscope104/original/$tier.html"
          done
          test "$(git hash-object /tmp/gingerscope104/parser.py)" = d5843a57f34078cbe7213aa78a4aa12a5775c016
          test "$(git hash-object /tmp/gingerscope104/original/ancients.html)" = ce8178ab9579e8782d8f72a6dac051756a728506
          test "$(git hash-object /tmp/gingerscope104/original/godlies.html)" = d3cf222a8e10cff3a9fb051b16188192389c4b2d
          test "$(git hash-object /tmp/gingerscope104/original/chromas.html)" = 6c77624cac3df96168b008e9bc8eca68a2d78cf9
          echo STAGE104_FOUR_ORIGINAL_PUBLISHER_SOURCE_GIT_BLOBS_VERIFIED
      - name: Reparse real 3 original publisher sources and adversarial timestamp/URL states
        env:
          STAGE104_REQUIRE_PINNED: '1'
          STAGE104_ORIGINAL_PARSER: /tmp/gingerscope104/parser.py
          STAGE104_ORIGINAL_HTML_DIR: /tmp/gingerscope104/original
        run: |
          set -euo pipefail
          python3 -m py_compile pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py pdiddler/tests/test_stage104_publication_timestamp_gate.py
          python3 -m unittest -v pdiddler.tests.test_stage104_publication_timestamp_gate
      - name: Verify no auto-market-publish or game actions from source freshness result
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py').read_text()
          for required in ('publisherRefreshApproved":False',
                           '"priceForTradeVerified":False',
                           '"currentPricesVerified":False',
                           'MIXED_PUBLICATION_TIMESTAMPS',
                           'NO_NEW_PUBLISHER_PUBLICATION',
                           'NONCANONICAL_OR_STALE_ALIAS_URL',
                           'NEW_PUBLISHER_CANDIDATE_REVIEW_REQUIRED'):
              assert required in s,required
          for bad in ('urlopen(', 'requests.get(', 'subprocess.', 'HttpGet(',
                      'FireServer(', 'AcceptTrade(', 'PostAsync(', 'os.replace('):
              assert bad not in s,bad
          print('STAGE104_CANONICAL_SOURCE_FRESHNESS_NO_TRADING_AUTHORITY_PASS')
          PY
