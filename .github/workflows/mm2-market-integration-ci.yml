name: MM2 Market Integration CI

on:
  push:
    branches:
      - feature/mm2-market-aware-part4-v2_6
      - fix/mm2-v2_6-lag
      - fix/mm2-v2_6-ineligible-rebalance
      - fix/mm2-v2_6-no-plan-decline
      - feature/mm2-completed-trade-webhook
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install official Luau 0.745
        run: |
          curl -L --fail --retry 3             -o /tmp/luau.zip             https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          echo "186e5ddaa2b048ebc7390c11ed1b00c04e7d3beaffed429250329e3575d2ece2  /tmp/luau.zip" | sha256sum -c -
          mkdir -p /tmp/luau
          unzip -q /tmp/luau.zip -d /tmp/luau
          chmod +x /tmp/luau/*

      - name: Compile market integration modules
        run: |
          /tmp/luau/luau-compile pdiddler/pdiddler_market_profile_2026-11-02_v1_VALIDATED.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_market_logic_v1_TEST.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_market_planner_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_market_planner_v1_1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_market_bundle_cache_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_balancer_ROTATING_v2_4_MARKET_AWARE.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_balancer_ROTATING_v2_4_1_INELIGIBLE_FIX.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_balancer_ROTATING_v2_4_2_NO_PLAN_DECLINE.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6_1_PERF.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6_2_PERF_INELIGIBLE.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6_3_NO_PLAN_DECLINE.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_KNOWN_GOOD_MARKET_AWARE_v2_6_3.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler_market_integration_ci_v1.luau >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler4_market_bundle_cache_v1.luau >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler4_ineligible_plan_match_v1.luau >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v2.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v3.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_trade_webhook_payload_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_trade_telemetry_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_trade_completion_logic_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_trade_webhook_sender_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler4_balancer_ROTATING_v2_4_3_WEBHOOK_TELEMETRY.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_trade_completion_logger_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/pdiddler_WEBHOOK_TEST_STACK_v1.lua >/dev/null
          /tmp/luau/luau-compile pdiddler/tests/pdiddler_webhook_connection_LIVE_LAB_v1.lua >/dev/null

      - name: Run pure market integration tests
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler_market_integration_ci_v1.luau


      - name: Run market cache performance regression
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler4_market_bundle_cache_v1.luau

      - name: Run ineligible plan-match regression
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler4_ineligible_plan_match_v1.luau

      - name: Static Part 4 regression guards
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("pdiddler/pdiddler4_balancer_ROTATING_v2_4_MARKET_AWARE.lua").read_text()
          required=[
              "function M.run(scanner,marketProfile,marketLogic,marketPlanner)",
              "marketProfile.liveReady==true",
              "MARKET_LOGIC.bundleAssessment",
              "MARKET_LOGIC.tradeDecision",
              "MARKET_PLANNER.buildPlans",
              'local countKey=tostring(item.page or "")..":"..id',
              'local key=tostring(p.page or "")..":"..tostring(p.id or "")',
              'tostring(r.page or "")',
              'tostring(x.page or "")~=tostring(first.page or "")',
              'local offerKey=tostring(p.page or "")..":"..tostring(p.id or "")',
              "EmptyTimeout=15.0",
              "ActiveOfferWindow=60.0",
              "RecoveryMaxAttemptsPerOffer=2",
              "ExtremeReplanRatio=2.0",
              "ExtremeProfitFlat=50",
              "ExtremeProfitMultiple=2.5",
              "ExtremeMinReplanStep=5",
              "local function txValidate",
              "local function clearOurOffer",
              "local function applyPlan",
          ]
          forbidden=[
              "MARKET_QUALITY",
              "exactQuality",
              "qualityRatio",
              "rejected-risk",
              "NormalMinFlat",
              "DowngradeMinFlat",
              "BigDowngradeMinFlat",
              "UpgradeOverpayCapPct",
              "effectiveProfit",
              "effectiveRequired",
              "effectiveFloor",
              "local function buildPlans",
              "local function makeUnits",
              "local function marketProfileRecord",
              "local function marketItemAssessment",
              "AcceptTrade",
              'physicalClick(button,"Accept',
          ]
          for needle in required:
              assert needle in src, f"missing required guard: {needle}"
          for needle in forbidden:
              assert needle not in src, f"forbidden legacy/final-Accept token: {needle}"

          stack=Path("pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6.lua").read_text()
          assert "7809aa8c8d210d8005c223eb9fd3a6b3ea716ba5" in stack
          p1_run=stack.index("local ok1,res1=pcall(p1.run)")
          p2_run=stack.index("local ok2,res2=pcall(p2.run)")
          market_load=stack.index("local marketProfile=loadModule")
          assert p1_run < market_load and p2_run < market_load, "P1/P2 must run before market preload/preflight"
          assert "FINAL ITEM-TRADE ACCEPT IS DISABLED" in stack
          assert "AcceptTrade" not in stack
          print("PASS static Part 4 + stack regression guards")
          PY


      - name: No-plan decline behavior regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("pdiddler/pdiddler4_balancer_ROTATING_v2_4_2_NO_PLAN_DECLINE.lua")
          assert p.exists(), "new no-plan-decline Part 4 build missing"
          src=p.read_text()

          unresolved=src.index("if #theirEval.unresolved>0 then")
          stable=src.index("os.clock()-stableSince<C.OfferStability")
          no_plan=src.index("if #plans==0 then")
          decline=src.index('local declined,declineWhy=declineTrade("no-safe-plan")', no_plan)
          decline_fail=src.index('return "no-safe-plan-decline-failed"', no_plan)
          finish=src.index('return finishTradeClosed("no-safe-plan-declined")', no_plan)

          assert stable < no_plan, "no-plan decline must occur only after stability gate"
          assert unresolved < no_plan, "unresolved THEIR OFFER must remain a hold before no-plan decline"
          assert decline > no_plan, "no-plan branch must decline the trade"
          assert decline_fail > decline, "failed decline must not pretend the trade closed or resume rotation"
          assert finish > decline_fail, "successful no-plan decline must terminate the current Part 4 session"
          assert "waiting for offer change" not in src[no_plan:finish], "no-plan branch must not hold indefinitely"
          assert "AcceptTrade" not in src
          print("PASS no-plan stable resolved trade declines immediately")
          PY


      - name: Duplicate live-lab contract guards
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v1.lua").read_text()
          assert 'ICEBLASTER_ID="481"' in src
          assert 'expected x3 -> x2 -> x1' in src
          assert 'removeAndRequire(2)' in src
          assert 'removeAndRequire(1)' in src
          assert 'No third removal attempted.' in src
          assert 'DeclineTrade' in src
          assert 'AcceptTrade' not in src
          assert 'FINAL ACCEPT DISABLED / NOT IMPLEMENTED' in src
          print("PASS duplicate live-lab contract guards")
          PY


      - name: Duplicate live-lab v2 contract guards
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v2.lua").read_text()
          assert 'ICEBLASTER_ID="481"' in src
          assert 'local function visibleOurSlots' in src
          assert 'local function soleOurSlot' in src
          assert 'findIceblasterSlot' not in src
          assert 'SLOT DIAGNOSTIC' in src
          assert 'removeAndRequire(2)' in src
          assert 'removeAndRequire(1)' in src
          assert 'AcceptTrade' not in src
          assert 'FINAL ACCEPT DISABLED / NOT IMPLEMENTED' in src
          print("PASS duplicate live-lab v2 contract guards")
          PY


      - name: Duplicate live-lab v3 raw-owned-key regression
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("pdiddler/tests/pdiddler4_duplicate_remove_LIVE_LAB_v3.lua")
          assert p.exists(), "duplicate live lab v3 missing"
          src=p.read_text()
          assert 'GetProfileData' in src, "v3 must read own Weapons.Owned"
          assert 'Database' in src and 'Sync' in src, "v3 must resolve the owned key through MM2 Sync metadata"
          assert 'resolveOwnedIceblasterKey' in src
          assert 'offer:FireServer(ownedIceblasterKey,"Weapons")' in src
          assert 'offer:FireServer(ICEBLASTER_CHECKER_ID,"Weapons")' not in src
          assert 'AcceptTrade' not in src
          assert 'FINAL ACCEPT DISABLED / NOT IMPLEMENTED' in src
          print("PASS duplicate live-lab v3 raw-owned-key regression")
          PY


      - name: Known-good v2.6.3 freeze guard
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path("pdiddler/pdiddler_MARKET_AWARE_TEST_STACK_v2_6_3_NO_PLAN_DECLINE.lua").read_text()
          frozen=Path("pdiddler/pdiddler_KNOWN_GOOD_MARKET_AWARE_v2_6_3.lua").read_text()
          assert frozen == src, "known-good v2.6.3 must remain byte-identical to tested stack"
          assert "FINAL ITEM-TRADE ACCEPT IS DISABLED" in frozen
          assert "AcceptTrade" not in frozen
          print("PASS known-good v2.6.3 freeze guard")
          PY


      - name: Run completed-trade webhook payload contract
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler_trade_webhook_payload_v1.luau


      - name: Run completed-trade telemetry snapshot contract
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler_trade_telemetry_v1.luau

      - name: Run raw-key completion verification contract
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler_trade_completion_logic_v1.luau


      - name: Run Discord webhook sender transport contract
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler_trade_webhook_sender_v1.luau


      - name: Completed-trade webhook integration contract
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge=Path("pdiddler/pdiddler4_balancer_ROTATING_v2_4_3_WEBHOOK_TELEMETRY.lua")
          logger=Path("pdiddler/pdiddler_trade_completion_logger_v1.lua")

          assert bridge.exists(), "Part 4 webhook telemetry bridge missing"
          assert logger.exists(), "completed-trade logger missing"

          b=bridge.read_text()
          l=logger.read_text()

          # Part 4 remains trade authority; telemetry is read-only.
          assert "webhookCandidate" in b
          assert "publishWebhookCandidate" in b
          assert "clearWebhookCandidate" in b
          assert "tradeTelemetry.build" in b
          assert '"profitable-hold"' in b
          assert '"extreme-hold"' in b
          assert '"rebalance-verified"' in b
          for token in [
              '"their-offer-changed"',
              '"their-offer-empty"',
              '"their-offer-unresolved"',
              '"our-offer-unresolved"',
              '"recovery-active"',
              '"rebalance-active"',
              '"no-safe-plan"',
              '"trade-closed"',
          ]:
              assert token in b, f"bridge missing invalidation: {token}"

          assert "AcceptTrade" not in b
          assert 'physicalClick(button,"Accept' not in b
          assert 'physicalClick(button,"Confirm' not in b

          # Completion is server-confirmed first, inventory-delta verified second.
          assert 'FindFirstChild("AcceptTrade")' in l
          assert "OnClientEvent" in l
          assert "complete==true" in l
          assert 'FindFirstChild("DeclineTrade")' in l
          assert "GetProfileData" in l
          assert "Weapons" in l and "Owned" in l
          assert "expectedDelta" in l
          assert "deltaMatches" in l
          assert "inventory-verified-fallback" in l
          assert "logged" in l
          assert "webhookCandidate" in l

          # URL/credential must remain external to GitHub source.
          assert "PDIDDLER_DISCORD_WEBHOOK_URL" in l
          assert "discord.com/api/webhooks/" not in l
          assert "discordapp.com/api/webhooks/" not in l

          # Logger observes completion but never performs final trade acceptance.
          assert ":FireServer(" not in l
          assert "SendMouseButtonEvent" not in l
          assert "firesignal" not in l

          print("PASS completed-trade webhook integration contract")
          PY


      - name: Completed-trade webhook stack contract
        run: |
          python - <<'PY'
          from pathlib import Path

          stack=Path("pdiddler/pdiddler_WEBHOOK_TEST_STACK_v1.lua")
          lab=Path("pdiddler/tests/pdiddler_webhook_connection_LIVE_LAB_v1.lua")
          assert stack.exists(), "webhook test stack missing"
          assert lab.exists(), "webhook connection lab missing"

          src=stack.read_text()
          test=lab.read_text()

          for token in [
              "pdiddler_trade_webhook_payload_v1.lua",
              "pdiddler_trade_telemetry_v1.lua",
              "pdiddler_trade_completion_logic_v1.lua",
              "pdiddler_trade_webhook_sender_v1.lua",
              "pdiddler4_balancer_ROTATING_v2_4_3_WEBHOOK_TELEMETRY.lua",
              "pdiddler_trade_completion_logger_v1.lua",
          ]:
              assert token in src, f"stack missing {token}"

          assert "PDIDDLER_DISCORD_WEBHOOK_URL" in src
          assert "WEBHOOK LOGGER ACTIVE" in src
          assert "FINAL ITEM-TRADE ACCEPT IS DISABLED" in src
          assert "AcceptTrade" not in src
          assert "discord.com/api/webhooks/" not in src
          assert "discordapp.com/api/webhooks/" not in src

          p4=src.index("part4.run(")
          logger=src.index("completionLogger.run(")
          outgoing=src.index("outgoing.run(scanner)")
          assert p4 < logger < outgoing, (
              "completion logger must arm after Part 4 and before outgoing rotation"
          )

          assert "PDIDDLER_DISCORD_WEBHOOK_URL" in test
          assert "WEBHOOK CONNECTION TEST" in test
          assert "sender.sendBlocking" in test
          assert "AcceptTrade" not in test
          assert "OfferItem" not in test
          assert "DeclineTrade" not in test
          assert "discord.com/api/webhooks/" not in test
          assert "discordapp.com/api/webhooks/" not in test

          print("PASS completed-trade webhook stack + connection-lab contract")
          PY


      - name: Webhook credential leak guard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files=[
              Path("pdiddler/pdiddler_trade_webhook_payload_v1.lua"),
              Path("pdiddler/pdiddler_trade_telemetry_v1.lua"),
              Path("pdiddler/pdiddler_trade_completion_logic_v1.lua"),
              Path("pdiddler/pdiddler_trade_webhook_sender_v1.lua"),
              Path("pdiddler/pdiddler4_balancer_ROTATING_v2_4_3_WEBHOOK_TELEMETRY.lua"),
              Path("pdiddler/pdiddler_trade_completion_logger_v1.lua"),
              Path("pdiddler/pdiddler_WEBHOOK_TEST_STACK_v1.lua"),
              Path("pdiddler/tests/pdiddler_webhook_connection_LIVE_LAB_v1.lua"),
          ]

          secret_pattern=re.compile(
              r'https://(?:discord(?:app)?\.com)/api/webhooks/\d+/[A-Za-z0-9._-]+'
          )

          for p in files:
              src=p.read_text()
              assert not secret_pattern.search(src), f"webhook credential leaked in {p}"
              if p.name not in {
                  "pdiddler_trade_webhook_sender_v1.lua",
              }:
                  assert "discord.com/api/webhooks/" not in src, f"literal webhook URL prefix leaked in {p}"
                  assert "discordapp.com/api/webhooks/" not in src, f"literal legacy webhook URL prefix leaked in {p}"

          print("PASS webhook credential leak guard")
          PY


      - name: Run raw/checker market identity regression
        run: |
          /tmp/luau/luau pdiddler/tests/pdiddler4_market_identity_raw_checker_v1.luau


      - name: Part 4 market identity bridge contract
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path("pdiddler/pdiddler4_balancer_ROTATING_v2_4_4_MARKET_IDENTITY_WEBHOOK.lua")
          assert p.exists(), "Part 4 market-identity webhook build missing"
          src=p.read_text()

          assert "checkerId=first.checkerId" in src
          assert "checkerId=item.checkerId" in src
          assert 'id=tostring(item.checkerId or item.id or "")' in src, (
              "live market bundle must use checker id"
          )

          raw_id=src.index('local id=tostring(item.id or fullShownName(entry))')
          count_key=src.index('local countKey=tostring(item.page or "")..":"..id',raw_id)
          assert raw_id < count_key, "live counts must remain raw-id keyed"

          assert 'offer:FireServer(p.id,"Weapons")' in src, (
              "executor must still send raw planner id"
          )
          assert "AcceptTrade" not in src
          assert 'physicalClick(button,"Accept' not in src
          assert 'physicalClick(button,"Confirm' not in src

          print("PASS Part 4 market identity bridge contract")
          PY
