name: Gingerscope RBLXValue one-shot metadata (MANUAL ONLY)
on:
  workflow_dispatch:
    inputs:
      check:
        description: "One metadata-only API request. No weapon prices, trading or Discord."
        required: true
        type: choice
        options:
          - metadata-only
permissions:
  contents: read
concurrency:
  group: gingerscope-p1-rblxvalue-metadata-once
  cancel-in-progress: false

jobs:
  metadata-probe:
    if: ${{ github.ref == 'refs/heads/main' && inputs.check == 'metadata-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout immutable reviewed P1 research commit
        uses: actions/checkout@v4
        with:
          ref: d23c4af7928745fc6b5419f973e18faec9f75e69
          fetch-depth: 1
          persist-credentials: false
      - name: Verify adapter source pin
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "d23c4af7928745fc6b5419f973e18faec9f75e69"
          echo "P1 reviewed research code pin confirmed"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Source-rights and private probe preflight (NO API request)
        run: |
          python3 -m unittest -q pdiddler.ci.test_p1_source_rights_gate pdiddler.ci.test_p1_market_feed_v1 pdiddler.ci.test_p1_rblxvalue_v2_private_adapter
      - name: ONE authenticated metadata-only request (no raw prices)
        shell: bash
        env:
          RBLXVALUE_API_KEY: ${{ secrets.RBLXVALUE_API_KEY }}
          P1_PRIVATE_METADATA_PROBE: "YES"
        run: |
          set -euo pipefail
          python3 -m pdiddler.ci.p1_rblxvalue_v2_private_adapter --probe-meta > "$RUNNER_TEMP/rblxvalue-meta-response.json"
          # Independent client comparison: only if adapter reports a 403.
          # curl reads its private header from stdin, never CLI args or logs.
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          record = json.loads((Path(os.environ["RUNNER_TEMP"]) / "rblxvalue-meta-response.json").read_text())
          if record.get("status") != "ACCESS_RESTRICTED":
              print("INDEPENDENT_CURL_CHECK=SKIPPED_NOT_403")
          else:
              key = os.environ.get("RBLXVALUE_API_KEY", "")
              print("SECRET_PREFIX_FORMAT=" + ("EXPECTED" if key.startswith("rbx_") else "UNEXPECTED"))
              # No secret, URL parameters, headers or raw body in outputs.
              config = 'url = "https://api.rblxvalue.com/v2/meta"\nrequest = "GET"\nheader = "Accept: application/json"\nheader = "X-Api-Key: ' + key + '"\noutput = "/dev/null"\nsilent\nshow-error = no\nwrite-out = "%{http_code}"\nmax-time = 8\n'
              try:
                  p = subprocess.run(["curl", "--config", "-", "--proto", "=https", "--max-redirs", "0"], input=config, text=True, capture_output=True, timeout=12, check=False)
                  code = p.stdout.strip()
                  print("INDEPENDENT_CURL_HTTP=" + (code if code in ("200","401","403","429") else "OTHER"))
                  print("INDEPENDENT_CURL_TRANSPORT=" + ("OK" if p.returncode == 0 else "FAILED"))
              except (OSError, subprocess.TimeoutExpired):
                  print("INDEPENDENT_CURL_TRANSPORT=FAILED")
          PY
          python3 - <<'PY'
          import json, os, pathlib, re, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "rblxvalue-meta-response.json"
          try:
              record = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              print("METADATA_CHECK_RESULT=INVALID_SANITIZED_RESULT")
              raise SystemExit(1)
          status = record.get("status")
          reason = record.get("reason")
          allowed_status = {
              "RESEARCH_META_ONLY", "KEY_REQUIRED", "ACCESS_RESTRICTED",
              "RATE_LIMITED", "SOURCE_UNAVAILABLE", "BLOCKED", "DISABLED",
              "KEY_FORMAT_INVALID",
          }
          if status not in allowed_status:
              print("METADATA_CHECK_RESULT=UNEXPECTED_STATUS")
              raise SystemExit(1)
          if status != "RESEARCH_META_ONLY":
              print("METADATA_CHECK_RESULT=" + status)
              # Only print fixed, non-sensitive identifiers from the adapter.
              # Never show response bodies, exception messages or API key.
              safe_reason = (reason if isinstance(reason, str)
                  and re.fullmatch(r"[A-Z0-9_]{1,96}", reason) else "UNCLASSIFIED")
              print("METADATA_CHECK_REASON=" + safe_reason)
              print("NO_LIVE_DATA_OR_MARKET_AUTHORIZATION")
              raise SystemExit(1)
          if (record.get("marketFeedReadyForProduction") is not False
                  or record.get("upstreamRightsApproved") is not False
                  or record.get("maySendDiscordWebhook") is not False
                  or record.get("authorizesOffer") is not False
                  or record.get("confirmedMarketQuote") is not False):
              print("METADATA_CHECK_RESULT=PROHIBITED_AUTHORITY")
              raise SystemExit(1)
          print("METADATA_CHECK_RESULT=AUTHENTICATED_AGGREGATOR_METADATA_ONLY")
          print("PROVIDER_ITEM_COUNT=" + str(record["datasetItemsReported"]))
          print("PROVIDER_CLAIMED_REFRESH_HOURS=" + str(record["aggregatorRefreshHours"]))
          print("AGGREGATOR_LAST_UPDATED_TIMEZONE_UNVERIFIED=" +
                record["aggregatorLastUpdatedUnzoned"])
          print("AGGREGATOR_LAST_RUN_TIMEZONE_UNVERIFIED=" +
                record["aggregatorLastRunUnzoned"])
          print("SOURCE_DERIVED_FROM_SUPREME=" + str(record["knownSupremeDerivedData"]))
          print("LIVE_PRICE_AUTHORITY=BLOCKED")
          print("NO_WEAPON_PRICES_OR_DISCORD_SENT")
          PY
