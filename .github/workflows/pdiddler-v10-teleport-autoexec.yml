name: Pdiddler V10 teleport auto-reentry
on:
  pull_request:
    paths:
      - 'pdiddler/**'
      - '.github/workflows/pdiddler-v10-teleport-autoexec.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  queue-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run offline teleport queue and duplicate-owner tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          lua5.4 pdiddler/tests/v10_teleport_autoexec_test.lua
      - name: Audit that only V10 is loaded and no stateful executor files changed
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text=Path("pdiddler/pdiddler_V10_TELEPORT_AUTOBOOT_v1.lua").read_text()
          assert "58c9aede108b60278b9baa9dd7da73f7a4d95ac5" in text
          assert "pdiddler_FASTGATE_V5_INTEGRATED_TEST_v10_BOUNDED_SELECTION.lua" in text
          assert "pdiddler_native_trade_probe_v1.lua" in text
          assert "game.PlaceId~=142823291" in text
          assert 'local KEY="PDIDDLER_V10_TELEPORT_AUTOBOOT_v1"' in text
          assert 'or #bootstrapSha~=40' in text
          assert 'state.queueStatus="unsupported"' in text
          for unsafe in ["writefile(", "delfile(", "makefolder(", "clearqueueonteleport(",
                         "clear_teleport_queue(", "TeleportToPlaceInstance(", "TeleportAsync("]:
              assert unsafe not in text, unsafe
          print("PASS V10 bootstrap scoped; no persistent filesystem or teleport ownership changes")
          PY
