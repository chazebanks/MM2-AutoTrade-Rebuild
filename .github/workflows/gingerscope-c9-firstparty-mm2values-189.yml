name: Gingerscope C9 MM2Values 189 first-party research
on:
  pull_request:
    paths:
      - 'pdiddler/system2/c9_mm2values_firstparty_189.py'
      - 'pdiddler/ci/test_c9_mm2values_firstparty_189.py'
      - '.github/workflows/gingerscope-c9-firstparty-mm2values-189.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publisher-sourced-research-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audited HTML parser
        run: python3 -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5'
      - name: Adversarial first-party source guards
        run: |
          python3 -m unittest -v pdiddler.ci.test_c9_mm2values_firstparty_189
          python3 -m unittest -v pdiddler.ci.test_c9_historical_dual_list_reconciliation
      - name: Attempt four genuine first-party MM2Values pages from GitHub
        id: direct
        continue-on-error: true
        run: |
          python3 -m pdiddler.system2.c9_mm2values_firstparty_189 \
            --original pdiddler/system2/c9_research_public_189_crosswalk.json \
            --output /tmp/c9-firstparty-mm2values-189-research.json
      - name: Report direct-source collector refusal without assuming HTTP failed
        if: steps.direct.outcome == 'failure'
        run: |
          echo 'MM2VALUES_DIRECT_SOURCE_PIPELINE=BLOCKED_OR_UNVERIFIED'
          echo 'MM2VALUES_REASON=SEE_COLLECTOR_REASON_HTTP_PARSE_OR_SOURCE'
          echo 'CURRENT_TRADE_DATA_AUTHORIZED=FALSE'
      - name: Verify fresh research output is still non-actionable
        if: steps.direct.outcome == 'success'
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from pdiddler.system2.c9_mm2values_firstparty_189 import validate_freshness
          x=json.loads(Path('/tmp/c9-firstparty-mm2values-189-research.json').read_text())
          assert x['matchedHistoricalGameKeys']==len(x['rows'])==189
          assert x['categoryGameKeys']=={'ancient':15,'godly':128,'chroma':46}
          assert x['firstPartyDirectGithubFetchVerified'] is True
          assert x['authorizesTrade'] is False
          assert x['authorizesOffer'] is False
          assert x['authorizesAccept'] is False
          assert x['safeForLiveMarketQuotes'] is False
          validate_freshness(x,now_utc=datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z'))
          print('C9_MM2VALUES_FIRSTPARTY_189_FETCHED_RESEARCH_ONLY')
          PY
      - name: Archive temporary PUBLIC research receipt not gameplay data
        if: steps.direct.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gingerscope-c9-mm2values-firstparty-research-only
          path: /tmp/c9-firstparty-mm2values-189-research.json
          retention-days: 7
          if-no-files-found: error
