name: Gingerscope Stage25 Supreme live-source preflight
on:
  pull_request:
    paths:
      - 'pdiddler/refresh_supreme_snapshot.py'
      - 'pdiddler/tests/test_refresh_supreme_snapshot.py'
      - '.github/workflows/gingerscope-stage25-market-preflight.yml'
      - 'pdiddler/new_part4/STAGE25_READONLY_DIAGNOSTIC.lua'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-supreme-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Lua 5.4 for existing snapshot consumer tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Run existing Python source identity and fixed-expiry tests
        run: python3 -m unittest -v pdiddler.tests.test_refresh_supreme_snapshot
      - name: Try DIRECT Supreme fetch with existing Python parser
        id: direct-source
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p /tmp/gingerscope-market-preflight
          python3 pdiddler/refresh_supreme_snapshot.py \
            --mapping pdiddler/snapshots/supreme_snapshot_2026_11_04.json \
            --output-dir /tmp/gingerscope-market-preflight
          echo "SOURCE_ACQUISITION=direct-official-fetch" >> "$GITHUB_ENV"
      - name: Import immutable browser-retrieved source if direct fetch was blocked
        if: steps.direct-source.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 pdiddler/stage25_import_source_blobs.py \
            --manifest pdiddler/source_evidence/stage25_supreme_browser_import_manifest.json \
            --output-dir /tmp/gingerscope-browser-html
          python3 pdiddler/refresh_supreme_snapshot.py \
            --mapping pdiddler/snapshots/supreme_snapshot_2026_11_04.json \
            --input-dir /tmp/gingerscope-browser-html \
            --output-dir /tmp/gingerscope-market-preflight
          echo "SOURCE_ACQUISITION=third-party-browser-capture-verified-from-immutable-source" >> "$GITHUB_ENV"
      - name: Validate generated exact canonical records and real publish/retrieval bounds
        run: |
          python3 - <<'PY'
          from datetime import datetime, timezone
          from pathlib import Path
          import json
          root=Path('/tmp/gingerscope-market-preflight')
          files=list(root.glob('supreme_snapshot_*.json'))
          assert len(files)==1, 'exactly one parsed source required'
          p=json.loads(files[0].read_text())
          assert p['coverage']['total']==190
          assert p['coverage']['finite']==189
          assert p['coverage']['unpriced']==1
          assert len(p['sources'])==3
          import os
          acquisition=os.environ.get('SOURCE_ACQUISITION')
          assert acquisition in ('direct-official-fetch',
              'third-party-browser-capture-verified-from-immutable-source')
          if acquisition.startswith('third-party'):
              manifest=json.loads(Path(
                  'pdiddler/source_evidence/stage25_supreme_browser_import_manifest.json'
                  ).read_text())
              for page,entry in manifest['sources'].items():
                  source=p['sources'][page]
                  assert source['observedAt']==entry['observedAt']
                  assert source['publishedAt']==entry['publishedAt']
                  assert source['url']==entry['url']
          print('SOURCE_ACQUISITION:',acquisition)
          names={(r['page'],r['id']) for r in p['rows']}
          assert len(names)==190
          assert ('ancient','771') in names
          scope=next(r for r in p['rows'] if r['page']=='ancient' and r['id']=='771')
          assert scope['name']=='Gingerscope'
          def epoch(v): return int(datetime.fromisoformat(v.replace('Z','+00:00')).timestamp())
          now=int(datetime.now(timezone.utc).timestamp())
          assert epoch(p['observedAt']) <= now < epoch(p['expiresAt']), 'source not fresh'
          for s in p['sources'].values():
              assert len(s['sha256'])==64
              assert epoch(s['publishedAt'])<=epoch(s['observedAt'])<=now
          print('PASS: current 190 canonical records, 3 source SHA256, dated publication and retrieval')
          print('Source publication:',p['publishedAt'],'Observation:',p['observedAt'],
                'Expiry:',p['expiresAt'],'Gingerscope:',scope['supremeValue'])
          PY
      - name: Check candidate against REAL Lua market consumer and original expiry
        shell: bash
        run: |
          set -euo pipefail
          file="$(find /tmp/gingerscope-market-preflight -maxdepth 1 -name 'pdiddler_supreme_snapshot_*.lua' -type f)"
          test -n "$file"
          LUA_CANDIDATE_PATH="$file" lua5.4 - <<'LUA'
          local S=assert(dofile(os.getenv("LUA_CANDIDATE_PATH")))
          local c=S.coverage()
          assert(S.liveReady and c.total==190 and c.finite==189 and c.unpriced==1)
          assert(c.ancient==16 and c.chroma==46 and c.godly==128)
          local g=assert(S.get("ancient","771"))
          assert(g.name=="Gingerscope" and g.supremeValue==16000 and g.demand==5)
          assert(g.verified and g.provenance and g.provenance.sha256)
          assert(S.get("godly","not-a-real-id")==nil)
          assert(S.isFresh() and S.isFresh(S.expiresAtEpoch-1))
          assert(not S.isFresh(S.expiresAtEpoch))
          assert(not S.isFresh(S.observedAtEpoch-1))
          print("PASS: actual Lua profile, 190 items, canonical Gingerscope and fixed source expiry")
          LUA
      - name: Upload review-only candidate snapshot (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: supreme-source-checked-candidate
          path: |
            /tmp/gingerscope-market-preflight/*.json
            /tmp/gingerscope-market-preflight/*.lua
            pdiddler/source_evidence/stage25_supreme_browser_import_manifest.json
          if-no-files-found: error
          retention-days: 7
