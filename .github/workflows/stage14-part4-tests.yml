name: Staged Part 4 Lua regression tests
on:
  pull_request:
    paths:
      - 'pdiddler/new_part4/**'
      - 'pdiddler/intelligence_lab/**'
      - '.github/workflows/stage14-part4-tests.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
      - name: Run isolated safety, observer, removal, and preflight tests
        shell: bash
        run: |
          set -euo pipefail
          for name in \
            test_p4_safety_core \
            test_p4_observer_contract \
            test_p4_native_mock \
            test_p4_removal_executor \
            test_p4_native_removal \
            test_p4_stage8_stage9_stage10_integration \
            test_p4_coordinator \
            test_p4_stability_gate \
            test_p4_risk_review \
            test_p4_dual_perspective \
            test_p4_replacement_cutover \
            test_p4_replacement_native_lifecycle \
            test_p4_offer_placement \
            test_p4_replacement_offer_integration \
            test_p4_strategy_permit \
            test_p4_strategy_recovery_integration \
            test_p4_live_context \
            test_stage25_readonly_diagnostic \
            test_stage25_scanner_only_boot \
            test_stage26_dated_profile \
            test_stage27_lab_transaction \
            test_stage27_native_transport \
            test_stage28_accept_timeline \
            test_stage28_native_accept_integration \
            test_stage29_postclose_ledger \
            test_stage30_client_signal_census \
            test_stage32_result_correlation \
            test_stage33_transport_window \
            test_stage34_offer_delta_reconcile \
            test_stage35_slot_identity_metadata \
            test_stage36_icon_catalog_audit \
            test_stage36_reference_safety \
            test_stage36_exact_reference \
            test_stage36_exact_native \
            test_stage36_image_relation \
            test_stage36_image_relation_native \
            test_trade_update_shape \
            test_trade_update_shape_native \
            test_direct_key_offer_event_correlation_native \
            test_stage39_literal_presence \
            test_stage39_literal_presence_native \
            test_stage40_trade_schema_hypothesis \
            test_stage41_key_type_first_failure \
            test_stage42_player_orientation \
            test_stage43_dynamic_own_offer \
            test_stage44_client_offer_state \
            test_stage44_add_remove_native \
            test_stage45_start_trade_payload \
            test_stage45_start_trade_native; do
            lua5.4 "pdiddler/new_part4/tests/${name}.lua" pdiddler/new_part4
          done
          lua5.4 pdiddler/new_part4/stage12/tests/test_stage12_probe.lua pdiddler/new_part4/stage12

      - name: Test Python strategy integration against actual Stage 17 Lua
        shell: bash
        run: |
          set -euo pipefail
          cd pdiddler/intelligence_lab
          python3 -m unittest discover -q
