name: Gingerscope System1 Step2 PUBLIC P3/P4 integration (OFFLINE)
on:
  pull_request:
    paths:
      - 'pdiddler/system1/system1_step2_*.lua'
      - 'pdiddler/system1/SYSTEM1_STEP2_*.lua'
      - 'pdiddler/ci/system1_step2_*.luau'
      - 'pdiddler/ci/test_system1_step2_public_guard.py'
      - 'pdiddler/system1/SYSTEM1_STEP2_PUBLIC_RUNBOOK.md'
      - '.github/workflows/gingerscope-system1-step2-public-p3p4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-public-source-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified official Lune v0.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 50 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o "$RUNNER_TEMP/lune.zip"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $RUNNER_TEMP/lune.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/dist"
          install -m 0755 "$(find "$RUNNER_TEMP/dist" -name lune -type f -print -quit)" "$RUNNER_TEMP/lune"
      - name: Pure P3/P4 handoff and boundary negative tests
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step2_public_handoff_controller_mocks.luau
      - name: Original source-based public P3 one-send and pending-cancel mocks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step2_public_p3_source_mocks.luau
      - name: Frozen public target UserId and Player object gate checks
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step2_public_target_gate_mocks.luau
      - name: Actual Step2 native GUI loader plus original protected P4 client-decline wiring
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step2_public_native_wiring_mocks.luau
      - name: Luau syntax-check actual production candidate without running Roblox actions
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step2_public_luau_compile_only.luau
      - name: Python pinned-trust and forbidden-action regression
        run: |
          set -euo pipefail
          python3 -m unittest -v pdiddler.ci.test_system1_step2_public_guard
      - name: Preserve original System1 native ARM8 and P3 regression
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_main_auto_native_original_mocks.luau
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_p3_single_send_epoch_mocks.luau
