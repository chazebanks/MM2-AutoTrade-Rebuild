name: Supervised MM2 single-item manually armed pilot — real runner mocks
on:
  pull_request:
    paths:
      - 'pdiddler/supervised/supervised_one_item_policy.lua'
      - 'pdiddler/supervised/SUPERVISED_ONE_ITEM_MANUAL_PILOT.lua'
      - 'pdiddler/new_part4/stage100_screen_prompt_overlay.lua'
      - 'pdiddler/ci/supervised_one_item_pilot_tests.luau'
      - 'pdiddler/ci/supervised_one_item_native_runner_mocks.luau'
      - 'pdiddler/supervised/supervised_p3_p4_handoff.lua'
      - 'pdiddler/ci/supervised_p3_p4_handoff_mocks.luau'
      - 'pdiddler/supervised/supervised_four_slot_operator_plan.lua'
      - 'pdiddler/ci/supervised_four_slot_operator_plan_mocks.luau'
      - 'pdiddler/supervised/SUPERVISED_FOUR_SLOT_MANUAL_PILOT.lua'
      - 'pdiddler/ci/supervised_four_slot_native_runner_mocks.luau'
      - '.github/workflows/gingerscope-supervised-one-item-pilot.yml'
  push:
    branches:
      - feature/supervised-one-item-manual-pilot
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-shot-manual-offer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install checksum-pinned official Lune v0.11.1
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 50 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o "$RUNNER_TEMP/lune.zip"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $RUNNER_TEMP/lune.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/dist"
          f="$(find "$RUNNER_TEMP/dist" -name lune -type f -print -quit)"
          test -n "$f"
          install -m 0755 "$f" "$RUNNER_TEMP/lune"
      - name: Run local manual approval gate and explicit denial cases
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/supervised_one_item_pilot_tests.luau
      - name: Execute actual iPad launcher against mocked TradeGUI + OfferItem
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/supervised_one_item_native_runner_mocks.luau
      - name: Exercise live P3->P4 exact session and physical slot interface in Lua
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/supervised_p3_p4_handoff_mocks.luau
      - name: Exercise approved multi-item four physical-slot plan against real guarded IO
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/supervised_four_slot_operator_plan_mocks.luau
      - name: Execute actual guided four-slot iPad runner under mocked original MM2
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/supervised_four_slot_native_runner_mocks.luau
      - name: Verify no auto trading, final Accept, market quote or Discord source
        run: |
          set -euo pipefail
          test "$(git hash-object pdiddler/supervised/pdiddler4_tradeio_supervised_v2.lua)" = eb4dc6342d1d6dda6292490cd8fa00314199d589
          test "$(git hash-object pdiddler/supervised/supervised_one_item_policy.lua)" = d67f8addbeb14552a35cded9a55f2c4ddf92dd56
          test "$(git hash-object pdiddler/new_part4/stage100_screen_prompt_overlay.lua)" = e0eac8e039655999bd7bbac1f12da179db7c22ed
          test "$(git hash-object pdiddler/pdiddler3_outgoing_PART4_BRIDGE_v5.lua)" = a13596ecae607c323b1fc93f34072b3e959c3f84
          test "$(git hash-object pdiddler/pdiddler3_scanner_MODULE_v6_5_PART4_STATUS_BRIDGE.lua)" = f7190538cbc882e23b22f723f3af0b6140a98bcd
          python3 - <<'PY'
          from pathlib import Path
          controller=Path('pdiddler/supervised/supervised_one_item_policy.lua').read_text()
          runner=Path('pdiddler/supervised/SUPERVISED_ONE_ITEM_MANUAL_PILOT.lua').read_text()
          for s in (controller,runner):
              for forbidden in ('AcceptTrade:FireServer(', 'SendRequest:FireServer(',
                                'DeclineTrade:FireServer(', 'OfferItem:FireServer(',
                                'TeleportService', 'PostAsync(', 'GetFullInventory:InvokeServer('):
                  assert forbidden not in s,forbidden
          bridge=Path('pdiddler/supervised/supervised_p3_p4_handoff.lua').read_text()
          scanner=Path('pdiddler/pdiddler3_scanner_MODULE_v6_5_PART4_STATUS_BRIDGE.lua').read_text()
          outgoing=Path('pdiddler/pdiddler3_outgoing_PART4_BRIDGE_v5.lua').read_text()
          for method in ('getRecord','isWhitelisted'):
              assert f'function ScannerAPI.{method}(' in scanner
          for method in ('isPaused=function()', 'resume=function(reason)'):
              assert method in outgoing
          assert 'io.sideSignature(io.readSide' in bridge
          assert 'physical~=src.slots' in bridge
          assert 'PROTECTED_GINGERSCOPE_IN_OWN_OFFER' in bridge
          for forbidden in ('OfferItem:FireServer(', 'AcceptTrade:FireServer(', 'DeclineTrade:FireServer(', 'PostAsync('):
              assert forbidden not in bridge
          plan=Path('pdiddler/supervised/supervised_four_slot_operator_plan.lua').read_text()
          guided=Path('pdiddler/supervised/SUPERVISED_FOUR_SLOT_MANUAL_PILOT.lua').read_text()
          assert '4f186f3ad1db538512a735e1a18e220f23e8715a' in guided
          assert 'e0dc690e6bf322e3a43c685547a817d1eda0761f' not in guided
          assert 'expectedDisplayNames' in plan
          assert 'expectedChromaFlags' in plan
          assert 'protected(display)' in plan
          assert 'candidate.name~=approved.display' in plan
          assert '98828a6e8505edfd49658e4f8b5b33b88d482d96' == __import__('subprocess').check_output(
              ['git','hash-object','pdiddler/supervised/supervised_four_slot_operator_plan.lua'],text=True).strip()
          assert 'bridgeModule.bind(' in guided
          assert 'planModule.run' in guided
          assert 'guide:safeForOffer(root)' in guided
          assert 'E.PDIDDLER_SUPERVISED_FOUR_SLOT_SPENT_JOB' in guided
          assert 'E.PDIDDLER_SUPERVISED_FOUR_SLOT_LAST_SANITIZED_JSON=json' in guided
          assert 'manualContactOnly=true' in guided
          assert 'noAutomaticAcceptAcknowledged' in guided
          assert guided.count('game:HttpGet(')==1
          for forbidden in ('AcceptTrade:FireServer(', 'SendRequest:FireServer(', 'OfferItem:FireServer(', 'DeclineTrade:FireServer(', 'TeleportService', 'PostAsync('):
              assert forbidden not in guided
          assert 'spentBindings' in plan
          assert 'approval.noAutomaticAcceptAcknowledged~=true' in plan
          assert 'candidateAdded(expectedOwn,fresh.ours,approved)' in plan
          assert 'gate.checkOutbound=nil' in plan
          assert 'PROTECTED_GINGERSCOPE_IN_OWN_OFFER' in bridge
          for forbidden in ('AcceptTrade:FireServer(', 'OfferItem:FireServer(', 'DeclineTrade:FireServer(', 'SendRequest:FireServer(', 'PostAsync(', 'TeleportService'):
              assert forbidden not in plan
          assert runner.count('game:HttpGet(')==1
          assert 'THEIR_ACCEPT_STATE_UNKNOWN' in controller
          assert controller.count('their:FindFirstChild("Accepted")')==1
          assert '9540fc5fc3576729f9dd308d8d8222d848e27063' in runner
          assert 'a599c31c53d25e6799b9d631f45f282b445dcda0' in runner
          assert '9540fc5fc3576729f9dd308d8d8222d848e27063' in runner
          assert 'PDIDDLER_SUPERVISED_ONE_ITEM_SPENT_JOB' in runner
          assert 'ONSCREEN_GUIDE_' in runner
          assert 'guide:safeForOffer' in runner
          assert 'RenderStepped:Connect' in runner
          assert '5b8ee35d7f281c23d9c2181abd97a063e59a0660' in runner
          assert 'manualOfferOnly' in controller
          assert 'PROTECTED_GINGERSCOPE_OUTGOING' in controller
          assert 'authorizesAccept=false' in controller
          assert 'mayRecordCompletedTrade=false' in controller
          print('SUPERVISED_ONE_SHOT_OPERATOR_ONLY_NO_ACCEPT_OR_SETTLEMENT_PASS')
          PY
