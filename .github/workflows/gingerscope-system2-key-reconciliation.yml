name: Gingerscope System2 next six-feature historical-key native reconciliation (offline)
on:
  pull_request:
    paths:
      - 'pdiddler/system2/native_key_reconciliation_core.lua'
      - 'pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua'
      - 'pdiddler/ci/system2_native_key_reconciliation_mocks.luau'
      - 'pdiddler/system2/S2_NEXT_KEY_RECONCILIATION_HANDOFF_2026_11_14.md'
      - 'pdiddler/system2/SYSTEM2_READ_NEXT_2026_11_13.md'
      - '.github/workflows/gingerscope-system2-key-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-six-feature-lune:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate code-owner continuity pins and recover policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pdiddler.continuity.manager verify
          python3 -m pdiddler.continuity.manager recover
      - name: Verify immutable source SHA pins and original historical Stage83 registry
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin eea9d6f5da3dfac8599e2f3e7b9fe1764d6ba288
          git show eea9d6f5da3dfac8599e2f3e7b9fe1764d6ba288:pdiddler/system2/native_key_reconciliation_core.lua > "$RUNNER_TEMP/key-core.lua"
          test "$(git hash-object "$RUNNER_TEMP/key-core.lua")" = 6d6d5760930c284317b7cee3980b50880ea642fc
          cmp "$RUNNER_TEMP/key-core.lua" pdiddler/system2/native_key_reconciliation_core.lua
          grep -Fq eea9d6f5da3dfac8599e2f3e7b9fe1764d6ba288 pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua
          git fetch --no-tags --depth=1 origin 98e39c8d7e82e1ffbce4c0c15e3532e938f59274
          git show 98e39c8d7e82e1ffbce4c0c15e3532e938f59274:pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua > "$RUNNER_TEMP/key-runner.lua"
          test "$(git hash-object "$RUNNER_TEMP/key-runner.lua")" = 6c23cda8c0189f2d18157dbd372593a67621893a
          cmp "$RUNNER_TEMP/key-runner.lua" pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua
          git fetch --no-tags --depth=1 origin 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae
          git show 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae:pdiddler/intelligence_lab/stage83_public_slug_registry.lua > "$RUNNER_TEMP/stage83.lua"
          test "$(git hash-object "$RUNNER_TEMP/stage83.lua")" = 40e2a0ff01b70b2d0181c62cae347a08da82bcb8
          cp "$RUNNER_TEMP/stage83.lua" pdiddler/intelligence_lab/stage83_public_slug_registry.lua
          grep -Fq 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua
          echo SIX_FEATURE_SOURCE_PINS_MATCH_ORIGINAL_BYTES
      - name: Install immutable Lune v0.11.1 (official release SHA256)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lune-v0.11.1-linux-x86_64.zip"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip" \
            --output "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/lune-dist"
          found="$(find "$RUNNER_TEMP/lune-dist" -type f -name lune -print -quit)"
          test -n "$found"
          install -m 0755 "$found" "$RUNNER_TEMP/lune"
      - name: Run original Stage83 six-feature real iPad native key-batch in Lune
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system2_native_key_reconciliation_mocks.luau
      - name: Assert six-feature historical-key inspector has no mutation remotes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pdiddler/system2/SYSTEM2_KEY_RECONCILIATION_READONLY_NATIVE.lua').read_text()
          for forbidden in ('FireServer(', 'AcceptTrade(', 'DeclineTrade(', 'TeleportService', 'GetFullInventory', 'HttpService:PostAsync(', 'setreadonly(', 'hookmetamethod('):
              assert forbidden not in s, f"UNEXPECTED_NATIVE_ACTION_OR_NETWORK: {forbidden}"
          assert s.count('rf:InvokeServer()') == 1
          assert s.count('game:HttpGet(url)') == 1
          assert 'GetProfileData' in s and 'tradeVisible()' in s
          assert 'native_key_reconciliation_core.lua' in s and 'stage100_screen_prompt_overlay.lua' in s
          assert 'stage83_public_slug_registry.lua' in s
          assert 'GetProfileData' in s and 'RUN 6 NEW CHECKS' in s
          print("S2_SIX_FEATURE_HISTORICAL_KEY_READONLY_NO_ACTIONS_PASS")
          PY
  all-inherited-source-pinned-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover original Stage83 PR106 planner and corrected PR182 guard SHA pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/system2-pin"
          git fetch --no-tags --depth=1 origin 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae
          git show 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae:pdiddler/intelligence_lab/stage83_public_slug_registry.lua > "$RUNNER_TEMP/system2-pin/stage83.lua"
          git fetch --no-tags --depth=1 origin 6ed48e084bd58fab38e3bf061ac36fb295ecf103
          git show 6ed48e084bd58fab38e3bf061ac36fb295ecf103:pdiddler/intelligence_lab/future_portfolio_planner.py > "$RUNNER_TEMP/system2-pin/planner.py"
          git fetch --no-tags --depth=1 origin 94ecefee86fd36293dcac58d0c24d9f379e719e5
          git show 94ecefee86fd36293dcac58d0c24d9f379e719e5:pdiddler/intelligence_lab/offer_snapshot_guard.py > "$RUNNER_TEMP/system2-pin/guard.py"
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/stage83.lua")" = 40e2a0ff01b70b2d0181c62cae347a08da82bcb8
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/planner.py")" = 78948cdacd2a760db5b888fce242d598fc6f14b6
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/guard.py")" = 11db895622d053ddced4fba9666135bf97bd615b
          grep -Fq 'PROTECTED_GINGERSCOPE_OUTGOING' "$RUNNER_TEMP/system2-pin/guard.py"
      - name: Run 311 inherited research-only Python regressions on exact source blobs
        env:
          GINGERSCOPE_PINNED_STAGE83: ${{ runner.temp }}/system2-pin/stage83.lua
          STAGE120_REQUIRE_PINNED: '1'
          STAGE120_PLANNER: ${{ runner.temp }}/system2-pin/planner.py
          STAGE120_CORRECTED_GUARD: ${{ runner.temp }}/system2-pin/guard.py
        run: |
          python3 -m unittest -v \
            pdiddler.ci.test_market_inventory_revision_gate \
            pdiddler.ci.test_counterparty_candidate_explorer \
            pdiddler.ci.test_sealed_decision_source \
            pdiddler.ci.test_multitrade_growth_replay \
            pdiddler.ci.test_attractiveness_evidence_lab \
            pdiddler.ci.test_trade_scenario_lab \
            pdiddler.ci.test_stage120_corrected_guard_preview \
            pdiddler.ci.test_client_inventory_shadow \
            pdiddler.ci.test_market_research_reader \
            pdiddler.ci.test_publisher_page_parity \
            pdiddler.ci.test_operator_capture_adapter \
            pdiddler.ci.test_system2_catalog_discovery_diff
