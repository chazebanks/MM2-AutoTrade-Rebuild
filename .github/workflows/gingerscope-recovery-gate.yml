name: Gingerscope Recovery Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate-tests:
    name: Recovery regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run recovery unit tests
        run: python -m unittest discover -s pdiddler/continuity -p test_recovery_gate.py -v
      - name: Verify submitted receipt against GitHub
        if: github.event_name == 'pull_request'
        run: python pdiddler/continuity/recovery_gate.py pdiddler/continuity/recovery_receipt.json
