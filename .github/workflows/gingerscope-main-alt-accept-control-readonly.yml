name: Gingerscope MAIN ALT native Accept control read-only multi-feature (offline)
on:
  pull_request:
    paths:
      - 'pdiddler/supervised/MAIN_ALT_ACCEPT_DISCOVERY_READONLY_NATIVE.lua'
      - 'pdiddler/supervised/main_alt_accept_control_shape_probe.lua'
      - 'pdiddler/ci/main_alt_accept_control_readonly_native_mocks.luau'
      - 'pdiddler/supervised/MAIN_ALT_ACCEPT_CONTROL_DISCOVERY_HANDOFF_2026_11_14.md'
      - '.github/workflows/gingerscope-main-alt-accept-control-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-alt-readonly-native-lune:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact read-only native and original Stage9 source pin bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pdiddler.continuity.manager verify
          python3 -m pdiddler.continuity.manager recover
          git fetch --no-tags --depth=1 origin b41bfae1a897e99c5775eff98dc48c4148d7adc2
          git show b41bfae1a897e99c5775eff98dc48c4148d7adc2:pdiddler/supervised/main_alt_accept_control_shape_probe.lua > "$RUNNER_TEMP/original-shape.lua"
          test "$(git hash-object "$RUNNER_TEMP/original-shape.lua")" = b99e1dc1c24cd24f85684bd302a17f4a9e4ac918
          cmp "$RUNNER_TEMP/original-shape.lua" pdiddler/supervised/main_alt_accept_control_shape_probe.lua
          git fetch --no-tags --depth=1 origin b34c76e431ee7ee6cb3904ddf82add22f4a57e70
          git show b34c76e431ee7ee6cb3904ddf82add22f4a57e70:pdiddler/supervised/MAIN_ALT_ACCEPT_DISCOVERY_READONLY_NATIVE.lua > "$RUNNER_TEMP/original-runner.lua"
          test "$(git hash-object "$RUNNER_TEMP/original-runner.lua")" = 757d4fc6ca82f7257e12f0615013ba59dc6ad9e5
          cmp "$RUNNER_TEMP/original-runner.lua" pdiddler/supervised/MAIN_ALT_ACCEPT_DISCOVERY_READONLY_NATIVE.lua
          git fetch --no-tags --depth=1 origin 1971b93d324f0275e6a9affb472ac3e804439ed8
          git show 1971b93d324f0275e6a9affb472ac3e804439ed8:pdiddler/new_part4/p4_native_observer.lua > "$RUNNER_TEMP/original-stage9.lua"
          test "$(git hash-object "$RUNNER_TEMP/original-stage9.lua")" = a6338e946467ad738005bc5cb13cd2d2fbc2a2d0
          git show 1971b93d324f0275e6a9affb472ac3e804439ed8:pdiddler/new_part4/p4_observer_contract.lua > "$RUNNER_TEMP/original-stage9-contract.lua"
          test "$(git hash-object "$RUNNER_TEMP/original-stage9-contract.lua")" = 7c84456006bd684dacb0217d0ae092d6d67575a4
          git fetch --no-tags --depth=1 origin 5b8ee35d7f281c23d9c2181abd97a063e59a0660
          git show 5b8ee35d7f281c23d9c2181abd97a063e59a0660:pdiddler/new_part4/stage100_screen_prompt_overlay.lua > "$RUNNER_TEMP/original-geometry.lua"
          test "$(git hash-object "$RUNNER_TEMP/original-geometry.lua")" = e0eac8e039655999bd7bbac1f12da179db7c22ed
          # These original historical files are immutable PR source blobs and
          # are deliberately NOT checked in on the current stacked research branch.
          # Restore byte-verified originals ONLY in this ephemeral CI runner.
          mkdir -p pdiddler/new_part4
          cp "$RUNNER_TEMP/original-stage9.lua" pdiddler/new_part4/p4_native_observer.lua
          cp "$RUNNER_TEMP/original-stage9-contract.lua" pdiddler/new_part4/p4_observer_contract.lua
          cp "$RUNNER_TEMP/original-geometry.lua" pdiddler/new_part4/stage100_screen_prompt_overlay.lua
          test "$(git hash-object pdiddler/new_part4/p4_native_observer.lua)" = a6338e946467ad738005bc5cb13cd2d2fbc2a2d0
          test "$(git hash-object pdiddler/new_part4/p4_observer_contract.lua)" = 7c84456006bd684dacb0217d0ae092d6d67575a4
          test "$(git hash-object pdiddler/new_part4/stage100_screen_prompt_overlay.lua)" = e0eac8e039655999bd7bbac1f12da179db7c22ed
          grep -Fq b41bfae1a897e99c5775eff98dc48c4148d7adc2 pdiddler/supervised/MAIN_ALT_ACCEPT_DISCOVERY_READONLY_NATIVE.lua
          echo MAIN_ALT_NATIVE_ALL_FOUR_READONLY_SOURCE_PINS_MATCH
      - name: Install immutable official Lune v0.11.1
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/lune-v0.11.1-linux-x86_64.zip"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 \
            "https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip" \
            --output "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/lune-dist"
          found="$(find "$RUNNER_TEMP/lune-dist" -type f -name lune -print -quit)"
          test -n "$found"
          install -m 0755 "$found" "$RUNNER_TEMP/lune"
      - name: Execute actual original-MM2 native GUI and Stage9 tests
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/main_alt_accept_control_readonly_native_mocks.luau
      - name: Verify read-only, explicit human ARM and no final Accept dispatch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          a=Path('pdiddler/supervised/MAIN_ALT_ACCEPT_DISCOVERY_READONLY_NATIVE.lua').read_text()
          b=Path('pdiddler/supervised/main_alt_accept_control_shape_probe.lua').read_text()
          for s in (a,b):
              for forbidden in ('FireServer(', 'InvokeServer(', 'SendMouseButtonEvent(', 'firesignal(',
                  'button:Activate(', 'AcceptTrade:FireServer(', 'OfferItem:FireServer(',
                  'TeleportService', 'HttpService:PostAsync('):
                  assert forbidden not in s, forbidden
              assert 'authorizesAccept=false' in s
          assert 'ARM READ-ONLY' in a and 'NO_FINAL_ACCEPT' not in a
          assert 'ORIGINAL' in a or 'ORIGINAL' in b
          assert 'confirmedNativeAcceptBinding=false' in a
          assert 'NAMED_REMOTE_EVENT_EXISTS_UNAUTHENTICATED' in b
          print('NATIVE_ACCEPT_DISCOVERY_ZERO_TRADE_ACTIONS_PASS')
          PY
  all-inherited-source-pinned-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover original Stage83 PR106 planner and corrected PR182 guard SHA pins
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/system2-pin"
          git fetch --no-tags --depth=1 origin 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae
          git show 25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae:pdiddler/intelligence_lab/stage83_public_slug_registry.lua > "$RUNNER_TEMP/system2-pin/stage83.lua"
          git fetch --no-tags --depth=1 origin 6ed48e084bd58fab38e3bf061ac36fb295ecf103
          git show 6ed48e084bd58fab38e3bf061ac36fb295ecf103:pdiddler/intelligence_lab/future_portfolio_planner.py > "$RUNNER_TEMP/system2-pin/planner.py"
          git fetch --no-tags --depth=1 origin 94ecefee86fd36293dcac58d0c24d9f379e719e5
          git show 94ecefee86fd36293dcac58d0c24d9f379e719e5:pdiddler/intelligence_lab/offer_snapshot_guard.py > "$RUNNER_TEMP/system2-pin/guard.py"
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/stage83.lua")" = 40e2a0ff01b70b2d0181c62cae347a08da82bcb8
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/planner.py")" = 78948cdacd2a760db5b888fce242d598fc6f14b6
          test "$(git hash-object "$RUNNER_TEMP/system2-pin/guard.py")" = 11db895622d053ddced4fba9666135bf97bd615b
          grep -Fq 'PROTECTED_GINGERSCOPE_OUTGOING' "$RUNNER_TEMP/system2-pin/guard.py"
      - name: Run 311 inherited research-only Python regressions on exact source blobs
        env:
          GINGERSCOPE_PINNED_STAGE83: ${{ runner.temp }}/system2-pin/stage83.lua
          STAGE120_REQUIRE_PINNED: '1'
          STAGE120_PLANNER: ${{ runner.temp }}/system2-pin/planner.py
          STAGE120_CORRECTED_GUARD: ${{ runner.temp }}/system2-pin/guard.py
        run: |
          python3 -m unittest -v \
            pdiddler.ci.test_market_inventory_revision_gate \
            pdiddler.ci.test_counterparty_candidate_explorer \
            pdiddler.ci.test_sealed_decision_source \
            pdiddler.ci.test_multitrade_growth_replay \
            pdiddler.ci.test_attractiveness_evidence_lab \
            pdiddler.ci.test_trade_scenario_lab \
            pdiddler.ci.test_stage120_corrected_guard_preview \
            pdiddler.ci.test_client_inventory_shadow \
            pdiddler.ci.test_market_research_reader \
            pdiddler.ci.test_publisher_page_parity \
            pdiddler.ci.test_operator_capture_adapter \
            pdiddler.ci.test_system2_catalog_discovery_diff
