name: Gingerscope next-conversation plan integrity (docs only)
on:
  pull_request:
    paths:
      - 'pdiddler/NEXT_CONVERSATION_HANDOFF_2026_11_11.md'
      - 'pdiddler/continuity/NEXT_WORKPLAN_2026_11_11.json'
      - 'pdiddler/continuity/LEGACY_CLEANUP_AUDIT_2026_11_11.md'
      - 'pdiddler/START_HERE.md'
      - 'pdiddler/continuity/README.md'
      - 'pdiddler/continuity/current_state.json'
      - 'pdiddler/continuity/manifest.json'
      - 'pdiddler/RELEASE_READINESS.json'
      - 'pdiddler/ci/test_next_conversation_handoff.py'
      - '.github/workflows/gingerscope-next-conversation-handoff.yml'
      - 'pdiddler/system2/SYSTEM2_MISSION_LOCK_AND_TEST_GOVERNANCE_2026_11_14.md'
      - 'pdiddler/system2/SYSTEM2_READ_NEXT_2026_11_13.md'
      - 'pdiddler/system2/SYSTEM2_MODULAR_PLANNING_AND_TESTING_MATRIX_2026_11_13.md'
      - 'pdiddler/ci/test_system2_mission_lock_continuity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify current source-pinned continuation
        run: |
          python3 -m unittest -v \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_anchor_and_checkpoint_coherent \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_index_and_handoff_are_immutable_source_pinned \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_one_issue_next_then_ordered_backlog \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_growth_learning_and_action_denials \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_handoff_is_read_first_and_mentions_actual_limitations
      - uses: actions/checkout@v4
        with:
          ref: 8a5ab3073f850b1fa2eb40184a2fbf72d61856c4
          path: historical-handoff
          persist-credentials: false
          fetch-depth: 2
      - name: Verify the original November 11 documentation-only diff
        working-directory: historical-handoff
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = 8a5ab3073f850b1fa2eb40184a2fbf72d61856c4
          python3 -m unittest -v \
            pdiddler.ci.test_next_conversation_handoff.HandoffIntegrityTests.test_change_scope_is_only_docs_and_ci_not_game_scripts
      - name: Verify the November 25 offline sprint scope
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/gingerscope-completion-sprint-nov25' }}
        run: |
          set -eu
          base=bc467c1bfaff026b87e4b09979e1e9d581895bbc
          git fetch --no-tags --depth=1 origin "$base"
          python3 - "$base" <<'PY'
          import subprocess
          import sys
          allowed = {
              '.github/workflows/gingerscope-next-conversation-handoff.yml',
              '.github/workflows/gingerscope-whole-system-offline-debug.yml',
              'pdiddler/START_HERE.md',
              'pdiddler/RELEASE_READINESS.json',
              'pdiddler/gingerscope.py',
              'pdiddler/ci/test_gingerscope_application.py',
              'pdiddler/ci/test_gingerscope_application_state.py',
              'pdiddler/ci/test_manual_portfolio_review.py',
              'pdiddler/ci/test_portfolio_planner.py',
              'pdiddler/ci/test_supreme_market_editions.py',
              'pdiddler/continuity/current_state.json',
              'pdiddler/continuity/history_index.json',
              'pdiddler/continuity/manifest.json',
              'pdiddler/system2/GINGERSCOPE_COMPLETION_MATRIX_2026_11_25.md',
              'pdiddler/system2/GINGERSCOPE_COMPLETION_SPRINT_2026_11_25.md',
              'pdiddler/system2/GINGERSCOPE_DEPENDENCY_MAP.md',
              'pdiddler/system2/GINGERSCOPE_OFFLINE.md',
              'pdiddler/system2/application_state.py',
              'pdiddler/system2/examples/interrupted-session.json',
              'pdiddler/system2/examples/portfolio.json',
              'pdiddler/system2/gingerscope_requirements.json',
              'pdiddler/system2/manual_portfolio_review.py',
              'pdiddler/system2/portfolio_planner.py',
              'pdiddler/system2/portfolio_planner_benchmark.py',
              'pdiddler/system2/requirements-gingerscope.txt',
              'pdiddler/system2/supreme_market_editions.py',
              'pdiddler/system2/supreme_only_strategy_research.py',
              'pdiddler/system2/supreme_publisher_parity_2026_11_25.json',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', sys.argv[1], 'HEAD'], text=True
          ).splitlines())
          assert changed and changed <= allowed, sorted(changed - allowed)
          print('Current sprint diff contains only reviewed offline and continuity files')
          PY
      - name: Enforce System2 mission-first and distinct-capability testing for next conversations
        run: |
          python3 -m unittest pdiddler.ci.test_system2_mission_lock_continuity -v
      - name: Run source manifests and fail-closed recovery
        run: |
          python3 -m pdiddler.continuity.manager verify
          python3 -m pdiddler.continuity.manager recover
      - name: Preserve previously approved growth policy denials
        run: |
          python3 -m unittest pdiddler.ci.test_growth_policy_decision pdiddler.ci.test_release_readiness -v
