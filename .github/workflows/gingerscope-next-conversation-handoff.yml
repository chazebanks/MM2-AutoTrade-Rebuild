name: Gingerscope next-conversation plan integrity (docs only)
on:
  pull_request:
    paths:
      - 'pdiddler/NEXT_CONVERSATION_HANDOFF_2026_11_11.md'
      - 'pdiddler/continuity/NEXT_WORKPLAN_2026_11_11.json'
      - 'pdiddler/continuity/LEGACY_CLEANUP_AUDIT_2026_11_11.md'
      - 'pdiddler/START_HERE.md'
      - 'pdiddler/continuity/README.md'
      - 'pdiddler/continuity/current_state.json'
      - 'pdiddler/continuity/manifest.json'
      - 'pdiddler/RELEASE_READINESS.json'
      - 'pdiddler/ci/test_next_conversation_handoff.py'
      - '.github/workflows/gingerscope-next-conversation-handoff.yml'
      - 'pdiddler/system2/SYSTEM2_MISSION_LOCK_AND_TEST_GOVERNANCE_2026_11_14.md'
      - 'pdiddler/system2/SYSTEM2_DISCORD_LEARNING_PIPELINE_HANDOFF_2026_11_14.md'
      - 'pdiddler/system2/SYSTEM2_READ_NEXT_2026_11_13.md'
      - 'pdiddler/system2/SYSTEM2_MODULAR_PLANNING_AND_TESTING_MATRIX_2026_11_13.md'
      - 'pdiddler/ci/test_system2_mission_lock_continuity.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify source-pinned continuation and no Lua/Part4 changes
        run: |
          python3 -m unittest pdiddler.ci.test_next_conversation_handoff -v
      - name: Enforce System2 mission-first and distinct-capability testing for next conversations
        run: |
          python3 -m unittest pdiddler.ci.test_system2_mission_lock_continuity -v
      - name: Run source manifests and fail-closed recovery
        run: |
          python3 -m pdiddler.continuity.manager verify
          python3 -m pdiddler.continuity.manager recover
      - name: Preserve previously approved growth policy denials
        run: |
          python3 -m unittest pdiddler.ci.test_growth_policy_decision pdiddler.ci.test_release_readiness -v
