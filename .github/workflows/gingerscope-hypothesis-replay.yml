name: Gingerscope Hypothesis replay properties (offline)
# Stacked deliberately on draft sanitized replay PR134. NOT mergeable alone.
on:
  pull_request:
  push:
    branches:
      - research/gingerscope-hypothesis-replay-properties
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hypothesis-model-invariants:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Hypothesis 6.170.15
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "hypothesis==6.170.15"
          python -c 'import hypothesis; print("Hypothesis", hypothesis.__version__)'
      - name: Run actual replay engine properties and state machine
        shell: bash
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          set -euo pipefail
          python -m py_compile scripts/replay_trade_events.py
          python -m unittest discover -v -s pdiddler/intelligence_lab -p 'test_hypothesis_event_replay.py'
      - name: Preserve deterministic replay and merged intelligence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -v -s pdiddler/intelligence_lab -p 'test_trade_event_replay.py'
          python -m unittest discover -q -s pdiddler/intelligence_lab -p 'test_stage52_market_refresh_quarantine.py'
