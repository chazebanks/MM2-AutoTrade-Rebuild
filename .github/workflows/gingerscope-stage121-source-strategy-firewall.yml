name: Gingerscope Stage121 original source-to-strategy firewall
on:
  pull_request:
    paths:
      - 'pdiddler/intelligence_lab/stage121_source_to_strategy_firewall.py'
      - 'pdiddler/ci/test_stage121_source_to_strategy_firewall.py'
      - 'pdiddler/intelligence_lab/STAGE121_SOURCE_TO_STRATEGY_HANDOFF.md'
      - '.github/workflows/gingerscope-stage121-source-strategy-firewall.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-stage111-to-stage120-denial:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact Git-blob original parser and source admission / capture dependency verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gingerscope-stage121/original
          base=https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild
          curl -fsSL --retry 3 --max-time 45 "$base/af4fee60ab9db45f9f018bc0fc691f025e2fbd5f/pdiddler/refresh_supreme_snapshot.py" -o /tmp/gingerscope-stage121/original/stage69_parser.py
          for tier in ancients godlies chromas; do
            curl -fsSL --retry 3 --max-time 45 "$base/f08ceb35a9ff684ee2cf577ccce7542c436cc68e/pdiddler/research_source_html/stage84_2026_11_09/$tier.html" -o "/tmp/gingerscope-stage121/original/$tier.html"
          done
          curl -fsSL --retry 3 --max-time 45 "$base/35dff4925869638c1808376ef611c93e414b980c/pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py" -o /tmp/gingerscope-stage121/stage104.py
          curl -fsSL --retry 3 --max-time 45 "$base/57ad1c00e775e839fd05f3437c1bdbbfcd7161f6/pdiddler/intelligence_lab/stage110_trusted_source_admission.py" -o /tmp/gingerscope-stage121/stage110.py
          curl -fsSL --retry 3 --max-time 45 "$base/f3dfadb4b90c6a126e19dc4064514f795aea98e9/pdiddler/intelligence_lab/stage111_supreme_readonly_capture.py" -o /tmp/gingerscope-stage121/stage111.py
          test "$(git hash-object /tmp/gingerscope-stage121/original/stage69_parser.py)" = 'd5843a57f34078cbe7213aa78a4aa12a5775c016'
          test "$(git hash-object /tmp/gingerscope-stage121/original/ancients.html)" = 'ce8178ab9579e8782d8f72a6dac051756a728506'
          test "$(git hash-object /tmp/gingerscope-stage121/original/godlies.html)" = 'd3cf222a8e10cff3a9fb051b16188192389c4b2d'
          test "$(git hash-object /tmp/gingerscope-stage121/original/chromas.html)" = '6c77624cac3df96168b008e9bc8eca68a2d78cf9'
          test "$(git hash-object /tmp/gingerscope-stage121/stage104.py)" = '14b26009b3494de0994596df7ea2b329adad5e58'
          test "$(git hash-object /tmp/gingerscope-stage121/stage110.py)" = 'b88c7e60cf928cc2c5c67b34e28d34fecd9d9b58'
          test "$(git hash-object /tmp/gingerscope-stage121/stage111.py)" = '64e49ef680a879010da7f114d3be59413922d6b3'
          # These unmerged historical source files are copied into the CI
          # checkout only. This does not modify repository main or the PR.
          cp /tmp/gingerscope-stage121/stage104.py pdiddler/intelligence_lab/stage104_publication_timestamp_gate.py
          cp /tmp/gingerscope-stage121/stage110.py pdiddler/intelligence_lab/stage110_trusted_source_admission.py
          cp /tmp/gingerscope-stage121/stage111.py pdiddler/intelligence_lab/stage111_supreme_readonly_capture.py
          echo ORIGINAL_STAGE69_104_110_111_PINNED_SOURCE_CHAIN_PASS
      - name: Run REAL original-source transport → admission → nontradable strategy firewall
        env:
          STAGE121_REQUIRE_ORIGINAL: '1'
          STAGE121_ORIGINAL_ROOT: /tmp/gingerscope-stage121/original
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v pdiddler.ci.test_stage121_source_to_strategy_firewall
      - name: Strict absence of live offer / production price import writes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path("pdiddler/intelligence_lab/stage121_source_to_strategy_firewall.py").read_text()
          for token in ("FireServer(", "AcceptTrade(", "TeleportToPlaceInstance(", 
                        "requests.get(", "urllib.request.urlopen(", "HttpGet(",
                        "setclipboard(", "subprocess.run(", "open(", "write_text(", "write_bytes("):
              assert token not in s,token
          for expected in ("NO_NEW_PUBLICATION_KEEP_EXISTING_EXPIRY",
                           "OLD_PUBLICATION_FIXED_EXPIRY_PASSED",
                           "NEW_PUBLISHER_REQUIRES_INDEPENDENT_REVIEW",
                           "TRADE_POSTINGS_ARE_NOT_VERIFIED_COMPLETED_FILLS",
                           '"mayFeedStage120AsVerifiedMarket":False'):
              assert expected in s,expected
          print("STAGE121_SOURCE_STRATEGY_NO_PRICE_PROMOTION_OR_ACTION_PASS")
          PY
