name: Gingerscope System1 Step1 ALT dynamic recovery (OFFLINE)
on:
  pull_request:
    paths:
      - 'pdiddler/system1/SYSTEM1_STEP1_ALT_DYNAMIC_RECOVERY_NATIVE.lua'
      - 'pdiddler/system1/system1_step1_alt_recovery_controller.lua'
      - 'pdiddler/ci/system1_step1_alt_dynamic_recovery_native_mocks.luau'
      - 'pdiddler/system1/SYSTEM1_STEP1_ALT_DYNAMIC_RECOVERY_RUNBOOK.md'
      - '.github/workflows/gingerscope-system1-step1-alt-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-original-protected-step1:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified official Lune v0.11.1
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 50 https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip -o "$RUNNER_TEMP/lune.zip"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $RUNNER_TEMP/lune.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/lune.zip" -d "$RUNNER_TEMP/dist"
          install -m 0755 "$(find "$RUNNER_TEMP/dist" -name lune -type f -print -quit)" "$RUNNER_TEMP/lune"
      - name: Run three recovery windows under original protected P4 and isolated STOP cases
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_step1_alt_dynamic_recovery_native_mocks.luau
      - name: Original ARM8 P3 P4 regressions remain green
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_main_auto_native_original_mocks.luau
          "$RUNNER_TEMP/lune" run pdiddler/ci/system1_p3_single_send_epoch_mocks.luau
