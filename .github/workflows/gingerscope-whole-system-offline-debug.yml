name: Gingerscope Whole-System Offline Debug
on:
  pull_request:
    paths:
      - '.github/workflows/gingerscope-whole-system-offline-debug.yml'
      - 'pdiddler/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    strategy:
      fail-fast: false
      matrix:
        suite: [python, system2_native, protected_p3_p4_native]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies and Lune
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'beautifulsoup4>=4.12,<5' 'hypothesis==6.170.15'
          archive="$RUNNER_TEMP/lune.zip"
          curl -fsSL --retry 3 --connect-timeout 20 'https://github.com/lune-org/lune/releases/download/v0.11.1/lune-0.11.1-linux-x86_64.zip' -o "$archive"
          echo "39859282ce677fce19e6eb45c37596a90a25c324c95b4e7e02d428b6cae294a1  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/lunedist"
          install -m 0755 "$(find "$RUNNER_TEMP/lunedist" -type f -name lune -print -quit)" "$RUNNER_TEMP/lune"
      - name: Verify immutable historical registry and regenerate current public 189-gamekey snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 --retry 2 'https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild/25b48b60fdb2f971bbb6b2a2020f3c7c4432f7ae/pdiddler/intelligence_lab/stage83_public_slug_registry.lua' -o "$RUNNER_TEMP/stage83.lua"
          test "$(git hash-object "$RUNNER_TEMP/stage83.lua")" = '40e2a0ff01b70b2d0181c62cae347a08da82bcb8'
          echo "GINGERSCOPE_PINNED_STAGE83=$RUNNER_TEMP/stage83.lua" >> "$GITHUB_ENV"
          GINGERSCOPE_MARKET_OUTPUT="$RUNNER_TEMP/market.json" python3 -m pdiddler.system2.mm2tradehub_market_candidate
          python3 -m pdiddler.system2.public_market_gamekey_crosswalk \
            --market "$RUNNER_TEMP/market.json" --stage83 "$RUNNER_TEMP/stage83.lua" \
            --evaluated-utc "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" --output "$RUNNER_TEMP/crosswalk.json"
          cp "$RUNNER_TEMP/crosswalk.json" pdiddler/system2/research_market_crosswalk_current.json
          python3 - <<'PY'
          import datetime,json,pathlib
          x=json.loads(pathlib.Path('pdiddler/system2/research_market_crosswalk_current.json').read_text())
          assert x['matchedHistoricalGameKeys']==189
          at=datetime.datetime.fromisoformat(x['sourceRetrievedUtc'].replace('Z','+00:00'))
          pathlib.Path('pdiddler/system2/research_market_epoch.txt').write_text(str(int(at.timestamp())))
          print("PUBLIC_RESEARCH_STAGE83_KEYS",x['matchedHistoricalGameKeys'])
          PY
      - name: Stage original Stage9/Stage83 dependencies for historical contract tests
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y lua5.4
          base="https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild"
          mkdir -p /tmp/gingerscope-stage119
          cp "$RUNNER_TEMP/stage83.lua" pdiddler/intelligence_lab/stage83_public_slug_registry.lua
          curl -fsSL --retry 3 --max-time 50 "$base/1971b93d324f0275e6a9affb472ac3e804439ed8/pdiddler/new_part4/p4_observer_contract.lua" -o /tmp/gingerscope-stage119/stage9.lua
          curl -fsSL --retry 3 --max-time 50 "$base/1971b93d324f0275e6a9affb472ac3e804439ed8/pdiddler/new_part4/p4_native_observer.lua" -o /tmp/gingerscope-stage119/native_stage9.lua
          curl -fsSL --retry 3 --max-time 50 "$base/59d869b7d4d8fbcee3f2709e266b47ffb4a05d78/pdiddler/new_part4/stage100_screen_prompt_overlay.lua" -o /tmp/gingerscope-stage119/geometry.lua
          test "$(git hash-object /tmp/gingerscope-stage119/stage9.lua)" = '7c84456006bd684dacb0217d0ae092d6d67575a4'
          test "$(git hash-object /tmp/gingerscope-stage119/native_stage9.lua)" = 'a6338e946467ad738005bc5cb13cd2d2fbc2a2d0'
          test "$(git hash-object /tmp/gingerscope-stage119/geometry.lua)" = 'e0eac8e039655999bd7bbac1f12da179db7c22ed'
          cp /tmp/gingerscope-stage119/stage9.lua pdiddler/new_part4/p4_observer_contract.lua
          cp /tmp/gingerscope-stage119/native_stage9.lua pdiddler/new_part4/p4_native_observer.lua
          echo "STAGE118_STAGE9=/tmp/gingerscope-stage119/stage9.lua" >> "$GITHUB_ENV"
          echo "STAGE119_STAGE9=/tmp/gingerscope-stage119/stage9.lua" >> "$GITHUB_ENV"
          echo "STAGE119_STAGE9_NATIVE=/tmp/gingerscope-stage119/native_stage9.lua" >> "$GITHUB_ENV"
          echo "STAGE119_GEOMETRY=/tmp/gingerscope-stage119/geometry.lua" >> "$GITHUB_ENV"
          # Stage101/119 tests explicitly load these original immutable
          # dependencies from /tmp/gingerscope-stage220, never from new code.
          mkdir -p /tmp/gingerscope-stage220
          cp /tmp/gingerscope-stage119/stage9.lua /tmp/gingerscope-stage220/stage9.lua
          cp /tmp/gingerscope-stage119/native_stage9.lua /tmp/gingerscope-stage220/native_stage9.lua
          cp "$RUNNER_TEMP/stage83.lua" /tmp/gingerscope-stage220/stage83.lua
          curl -fsSL --retry 3 --max-time 50 "$base/15f762a27a968373ed82809345f1869e1f688b26/pdiddler/intelligence_lab/stage101_multiweapon_raw_key_match.lua" -o /tmp/gingerscope-stage220/stage101.lua
          curl -fsSL --retry 3 --max-time 50 "$base/af84b23173620b03e919187b08cd352c101ba4ea/pdiddler/supervised/supervised_p3_startup_supervisor.lua" -o /tmp/gingerscope-stage220/frozen_boot.lua
          curl -fsSL --retry 3 --max-time 50 "$base/9138751b5a57415939ffa1618ac57811d7c8ec7b/pdiddler/supervised/supervised_real_p3_rotation_handoff.lua" -o /tmp/gingerscope-stage220/frozen_coordinator.lua
          test "$(git hash-object /tmp/gingerscope-stage220/stage101.lua)" = '137585d778c3c08b8b6960013fa34a7b3fb7b463'
          test "$(git hash-object /tmp/gingerscope-stage220/frozen_boot.lua)" = '881713c2abe644c0823f46c4007a80815608ea05'
          test "$(git hash-object /tmp/gingerscope-stage220/frozen_coordinator.lua)" = '1d4decbc30378a3f83df7c6b83449c6ac5252899'
          echo "ORIGINAL_ARCHIVED_STAGE9_STAGE83_STAGE101_SOURCE_PINNED"
      - name: Stage exact original Stage120 and Stage121 code + archived first-party HTML
        if: ${{ matrix.suite == 'python' }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild"
          mkdir -p /tmp/gingerscope-stage120 /tmp/gingerscope121
          curl -fsSL --retry 3 --max-time 50 "$base/6ed48e084bd58fab38e3bf061ac36fb295ecf103/pdiddler/intelligence_lab/future_portfolio_planner.py" -o /tmp/gingerscope-stage120/planner.py
          curl -fsSL --retry 3 --max-time 50 "$base/94ecefee86fd36293dcac58d0c24d9f379e719e5/pdiddler/intelligence_lab/offer_snapshot_guard.py" -o /tmp/gingerscope-stage120/guard.py
          test "$(git hash-object /tmp/gingerscope-stage120/planner.py)" = '78948cdacd2a760db5b888fce242d598fc6f14b6'
          test "$(git hash-object /tmp/gingerscope-stage120/guard.py)" = '11db895622d053ddced4fba9666135bf97bd615b'
          dir="pdiddler/intelligence_lab"
          curl -fsSL --retry 3 --max-time 50 "$base/35dff4925869638c1808376ef611c93e414b980c/$dir/stage104_publication_timestamp_gate.py" -o "$dir/stage104_publication_timestamp_gate.py"
          curl -fsSL --retry 3 --max-time 50 "$base/57ad1c00e775e839fd05f3437c1bdbbfcd7161f6/$dir/stage110_trusted_source_admission.py" -o "$dir/stage110_trusted_source_admission.py"
          curl -fsSL --retry 3 --max-time 50 "$base/f3dfadb4b90c6a126e19dc4064514f795aea98e9/$dir/stage111_supreme_readonly_capture.py" -o "$dir/stage111_supreme_readonly_capture.py"
          test "$(git hash-object "$dir/stage104_publication_timestamp_gate.py")" = '14b26009b3494de0994596df7ea2b329adad5e58'
          test "$(git hash-object "$dir/stage110_trusted_source_admission.py")" = 'b88c7e60cf928cc2c5c67b34e28d34fecd9d9b58'
          test "$(git hash-object "$dir/stage111_supreme_readonly_capture.py")" = '64e49ef680a879010da7f114d3be59413922d6b3'
          curl -fsSL --retry 3 --max-time 50 "$base/af4fee60ab9db45f9f018bc0fc691f025e2fbd5f/pdiddler/refresh_supreme_snapshot.py" -o /tmp/gingerscope121/stage69_parser.py
          for tier in ancients godlies chromas; do
            curl -fsSL --retry 3 --max-time 50 "$base/f08ceb35a9ff684ee2cf577ccce7542c436cc68e/pdiddler/research_source_html/stage84_2026_11_09/$tier.html" -o "/tmp/gingerscope121/$tier.html"
          done
          test "$(git hash-object /tmp/gingerscope121/stage69_parser.py)" = 'd5843a57f34078cbe7213aa78a4aa12a5775c016'
          test "$(git hash-object /tmp/gingerscope121/ancients.html)" = 'ce8178ab9579e8782d8f72a6dac051756a728506'
          test "$(git hash-object /tmp/gingerscope121/godlies.html)" = 'd3cf222a8e10cff3a9fb051b16188192389c4b2d'
          test "$(git hash-object /tmp/gingerscope121/chromas.html)" = '6c77624cac3df96168b008e9bc8eca68a2d78cf9'
          echo "STAGE120_REQUIRE_PINNED=1" >> "$GITHUB_ENV"
          echo "STAGE120_PLANNER=/tmp/gingerscope-stage120/planner.py" >> "$GITHUB_ENV"
          echo "STAGE120_CORRECTED_GUARD=/tmp/gingerscope-stage120/guard.py" >> "$GITHUB_ENV"
          echo "STAGE121_REQUIRE_ORIGINAL=1" >> "$GITHUB_ENV"
          echo "STAGE121_ORIGINAL_ROOT=/tmp/gingerscope121" >> "$GITHUB_ENV"
          echo "EXACT_PR106_182_STAGE111_110_104_69_ALL_SOURCE_PINNED"
      - name: Run complete selected-family diagnostic (no actual game)
        shell: bash
        env:
          AUDIT_SUITE: ${{ matrix.suite }}
        run: |
          set -uo pipefail
          if [[ "$AUDIT_SUITE" == python ]]; then
            "$RUNNER_TEMP/lune" run pdiddler/ci/system2_native_v2_feedback_staging_mocks.luau || exit 1
            if python3 - <<'PY'
          import unittest
          from pdiddler.ci.test_next_conversation_handoff import HandoffIntegrityTests
          # This old guard checks a specific Nov11 docs-only PR diff, not a
          # repo-wide audit branch. Report an explicit SKIP, never a PASS.
          method="test_change_scope_is_only_docs_and_ci_not_game_scripts"
          old=getattr(HandoffIntegrityTests,method)
          setattr(HandoffIntegrityTests,method,unittest.skip(
            "Nov11 docs-only diff guard not applicable to full-system audit PR"
          )(old))
          from pathlib import Path
          names=["pdiddler.ci."+p.stem for p in sorted(
            Path("pdiddler/ci").glob("test_*.py"))]
          suite=unittest.defaultTestLoader.loadTestsFromNames(names)
          result=unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PY
            then a=0; else a=$?; fi
            if python3 -m unittest discover -s pdiddler/intelligence_lab -p 'test_*.py' -v; then b=0; else b=$?; fi
            python3 - <<'PY'
          import pathlib,py_compile
          paths=list(pathlib.Path('pdiddler').rglob('*.py'))+list(pathlib.Path('scripts').rglob('*.py'))
          for path in paths: py_compile.compile(str(path),doraise=True)
          print('ALL_PYTHON_MODULES_COMPILED',len(paths))
          PY
            c=$?
            echo "PYTHON_AUDIT results_ci=$a intelligence=$b compile=$c"
            if (( a || b || c )); then exit 1; fi
          else
            failures=0;total=0
            while IFS= read -r file; do
              if [[ "$AUDIT_SUITE" == system2_native && "$file" != pdiddler/ci/system2_*.luau ]]; then continue; fi
              if [[ "$AUDIT_SUITE" == protected_p3_p4_native && "$file" == pdiddler/ci/system2_*.luau ]]; then continue; fi
              total=$((total+1))
              echo "::group::NATIVE $file"
              if timeout 90s "$RUNNER_TEMP/lune" run "$file"; then rc=0; else rc=$?; fi
              echo "::endgroup::"
              if (( rc )); then
                echo "::error title=Native mock failure::$file exit code $rc"
                failures=$((failures+1))
              fi
            done < <(find pdiddler/ci -maxdepth 1 -type f -name '*.luau' | sort)
            echo "NATIVE_AUDIT suite=$AUDIT_SUITE total=$total failed=$failures"
            if (( failures )); then exit 1; fi
          fi

  frozen-native-loader-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Parse and fetch all exact frozen public modules for real native entrypoints
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pdiddler.ci.audit_runtime_dependency_pins

  all-native-source-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install SHA-256 pinned official Luau 0.746 compiler
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/luau-ubuntu-0.746.zip"
          curl -fsSL --retry 3 --connect-timeout 20 \
            'https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip' \
            -o "$archive"
          echo "30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/luau-dist"
          compiler="$(find "$RUNNER_TEMP/luau-dist" -type f -name luau-compile -print -quit)"
          test -n "$compiler"
          install -m 0755 "$compiler" "$RUNNER_TEMP/luau-compile"
      - name: Compile all Roblox Luau and Lune source files (report each failure)
        shell: bash
        run: |
          set -uo pipefail
          failures=0;total=0;archived_invalid=0;clean=0
          while IFS= read -r file; do
            # Historical pure Lua 5.4 standalone tests use a different parser.
            if [[ "$file" == pdiddler/tests/*.lua ]]; then continue; fi
            total=$((total+1))
            # Two older, superseded trading variants are *known unparseable*
            # (the later v14 / v1_9 versions have the missing closers).
            # Keep original history unmodified, prove they REMAIN quarantined,
            # and do not silently turn a failed archive into a supported source.
            case "$file" in
              pdiddler/pdiddler3_outgoing_ROTATING_v13_UNCERTAIN_OWNER.lua|pdiddler/pdiddler4_balancer_ROTATING_v1_8.lua)
                if "$RUNNER_TEMP/luau-compile" --binary "$file" >/dev/null 2>"$RUNNER_TEMP/luau-error.txt"; then
                  echo "::error title=Archived syntax quarantine changed::$file unexpectedly compiles; review history"
                  failures=$((failures+1))
                else
                  echo "::warning title=Known unusable archived Luau::$file has known unclosed block; never launch"
                  archived_invalid=$((archived_invalid+1))
                fi
                continue
                ;;
            esac
            if ! "$RUNNER_TEMP/luau-compile" --binary "$file" > /dev/null 2>"$RUNNER_TEMP/luau-error.txt"; then
              echo "::error title=Luau syntax/compatibility issue::$file"
              cat "$RUNNER_TEMP/luau-error.txt"
              failures=$((failures+1))
            else
              clean=$((clean+1))
            fi
          done < <(find pdiddler values -type f \( -name '*.lua' -o -name '*.luau' \) | sort)
          echo "COMPLETE_LUAU_COMPILATION total=$total supported_clean=$clean known_archived_invalid=$archived_invalid other_failures=$failures"
          if (( archived_invalid!=2 || failures )); then exit 1; fi
