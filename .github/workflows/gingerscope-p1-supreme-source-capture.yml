name: Gingerscope P1 first-party Supreme source research capture
on:
  pull_request:
    paths:
      - '.github/workflows/gingerscope-p1-supreme-source-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve exact original Stage69/104/110/111 and historical HTML
        shell: bash
        run: |
          set -euo pipefail
          base='https://raw.githubusercontent.com/chazebanks/MM2-AutoTrade-Rebuild'
          dir='pdiddler/intelligence_lab'
          mkdir -p "$dir" /tmp/gingerscope-p1
          curl -fsSL --retry 3 --max-time 45 "$base/35dff4925869638c1808376ef611c93e414b980c/$dir/stage104_publication_timestamp_gate.py" -o "$dir/stage104_publication_timestamp_gate.py"
          curl -fsSL --retry 3 --max-time 45 "$base/57ad1c00e775e839fd05f3437c1bdbbfcd7161f6/$dir/stage110_trusted_source_admission.py" -o "$dir/stage110_trusted_source_admission.py"
          curl -fsSL --retry 3 --max-time 45 "$base/f3dfadb4b90c6a126e19dc4064514f795aea98e9/$dir/stage111_supreme_readonly_capture.py" -o "$dir/stage111_supreme_readonly_capture.py"
          curl -fsSL --retry 3 --max-time 45 "$base/af4fee60ab9db45f9f018bc0fc691f025e2fbd5f/pdiddler/refresh_supreme_snapshot.py" -o /tmp/gingerscope-p1/stage69_parser.py
          for tier in ancients godlies chromas; do
            curl -fsSL --retry 3 --max-time 45 "$base/f08ceb35a9ff684ee2cf577ccce7542c436cc68e/pdiddler/research_source_html/stage84_2026_11_09/$tier.html" -o "/tmp/gingerscope-p1/$tier.html"
          done
          test "$(git hash-object "$dir/stage104_publication_timestamp_gate.py")" = 14b26009b3494de0994596df7ea2b329adad5e58
          test "$(git hash-object "$dir/stage110_trusted_source_admission.py")" = b88c7e60cf928cc2c5c67b34e28d34fecd9d9b58
          test "$(git hash-object "$dir/stage111_supreme_readonly_capture.py")" = 64e49ef680a879010da7f114d3be59413922d6b3
          test "$(git hash-object /tmp/gingerscope-p1/stage69_parser.py)" = d5843a57f34078cbe7213aa78a4aa12a5775c016
          test "$(git hash-object /tmp/gingerscope-p1/ancients.html)" = ce8178ab9579e8782d8f72a6dac051756a728506
          test "$(git hash-object /tmp/gingerscope-p1/godlies.html)" = d3cf222a8e10cff3a9fb051b16188192389c4b2d
          test "$(git hash-object /tmp/gingerscope-p1/chromas.html)" = 6c77624cac3df96168b008e9bc8eca68a2d78cf9
          echo PINNED_ORIGINAL_SOURCE_CHAIN_VERIFIED
      - name: Collect live canonical HTTPS source with original Stage111
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check requests
          mkdir -p /tmp/gingerscope-p1/capture
          set +e
          python3 -m pdiddler.intelligence_lab.stage111_supreme_readonly_capture \
            --parser /tmp/gingerscope-p1/stage69_parser.py \
            --prior-html-dir /tmp/gingerscope-p1 \
            --output-dir /tmp/gingerscope-p1/capture
          code=$?
          set -e
          echo "Original Stage111 exit code: $code (0 unchanged, 3 review, 2 inconclusive)"
          test "$code" -eq 0 -o "$code" -eq 2 -o "$code" -eq 3
      - name: Independently inspect capture bytes and enforce Stage121 research-only authority
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from datetime import datetime, timezone
          from pathlib import Path
          from pdiddler.intelligence_lab.stage121_source_to_strategy_firewall import assess
          root=Path('/tmp/gingerscope-p1/capture')
          receipt=json.loads((root/'source_audit.json').read_text())
          pages={'ancient':'ancients','godly':'godlies','chroma':'chromas'}
          for category,plural in pages.items():
              row=receipt['capturedSources'].get(category)
              path=root/('source_'+category+'.html')
              if row is not None:
                  assert path.is_file(), 'MISSING_CAPTURE_'+category
                  data=path.read_bytes()
                  assert hashlib.sha256(data).hexdigest()==row['sha256'], 'BODY_DIGEST_MISMATCH_'+category
                  assert len(data)==row['rawHtmlByteCount'], 'BODY_SIZE_MISMATCH_'+category
                  assert row['url']=='https://supremevalues.com/mm2/'+plural, 'NONCANONICAL_'+category
                  assert row['httpStatus']==200, 'BAD_HTTP_STATUS_'+category
          now=datetime.now(timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          review=assess(receipt,evaluated_utc=now)
          for field in ('authorizesOffer','authorizesTrade','authorizesAccept','mayFeedStage120AsVerifiedMarket','verifiedMarketQuote','mayReportProfit','maySendDiscordWebhook','mayUseForStrategyLearning','serverCompletionProven'):
              assert review[field] is False, 'AUTHORITY_ESCALATION_'+field
          assert review['tradeOutcome']=='UNKNOWN'
          summary={
              'researchOnly':True,
              'sourceCaptureStatus':receipt['status'],
              'sourceCaptureReason':receipt['reason'],
              'capturedPageCount':len(receipt['capturedSources']),
              'publisherUtc':receipt['admission'].get('observedPublisherUtc'),
              'rowChangeCount':receipt['admission'].get('rowChangeCount'),
              'stage121Status':review['status'],
              'stage121Reason':review['reason'],
              'sourceHashes':{k:v['sha256'] for k,v in receipt['capturedSources'].items()},
              'authority':{'offer':False,'trade':False,'accept':False,'verifiedMarketQuote':False,'learning':False},
          }
          (root/'p1_research_review.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          print('P1_RESEARCH_REVIEW',json.dumps(summary,sort_keys=True))
          assert receipt['captureCompleteness']=='THREE_CANONICAL_PAGES', 'INCOMPLETE_SOURCE_CAPTURE'
          assert receipt['status'] in ('NEW_PUBLISHER_CANDIDATE_REVIEW_REQUIRED','NO_NEW_PUBLISHER_PUBLICATION'), 'ORIGINAL_SOURCE_ADMISSION_INCONCLUSIVE'
          assert review['status']=='RESEARCH_ONLY', 'STAGE121_RESEARCH_BOUNDARY_NOT_MET'
          PY
      - name: Preserve public-source raw HTML and audit for independent manual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gingerscope-p1-supreme-source-research
          path: /tmp/gingerscope-p1/capture/
          retention-days: 7
          if-no-files-found: warn
